var scale=function(){ return (COARSE||Wd<700)?.55:1; };

function spawnEmber(init){ emb.push({x:rnd(0,Wd),y:init?rnd(0,Ht):Ht+10,vx:rnd(-8,8),vy:-rnd(14,40),r:rnd(.8,2.4),a:rnd(.4,.9),ph:rnd(0,6.28)}); }
function spawnFly(){ fly.push({x:rnd(0,Wd),y:rnd(Ht*.45,Ht),ph:rnd(0,6.28),sp:rnd(.4,1.1),r:rnd(1.2,2.4),bl:rnd(.6,1.6)}); }
function spawnMote(){ mote.push({x:rnd(0,Wd),y:rnd(0,Ht),vx:rnd(4,14),vy:rnd(-3,3),r:rnd(.5,1.4),a:rnd(.15,.4)}); }
function spawnPetal(init){ petals.push({x:rnd(0,Wd),y:init?rnd(-20,Ht):-20,vy:rnd(18,36),sw:rnd(.6,1.4),ph:rnd(0,6.28),r:rnd(4,7),rot:rnd(0,6.28),vr:rnd(-1,1),hue:Math.random()<.6?'#f4b9c4':'#f7d889'}); }
function volley(){
  var n=Math.round(rnd(3,6)), ltr=Math.random()<.5;
  for(var i=0;i<n;i++){
    var x0=ltr?rnd(-80,Wd*.2):rnd(Wd*.8,Wd+80), x1=ltr?rnd(Wd*.7,Wd+100):rnd(-100,Wd*.3);
    arrows.push({t0:clock+i*.14+rnd(0,.08),dur:rnd(1.5,2.2),x0:x0,y0:rnd(Ht*.55,Ht*.8),x1:x1,y1:rnd(Ht*.5,Ht*.8),h:rnd(Ht*.35,Ht*.6)});
  }
}
function flock(){
  var ltr=Math.random()<.5, y=rnd(Ht*.12,Ht*.38), n=Math.round(rnd(4,7)), arr=[];
  for(var i=0;i<n;i++) arr.push({dx:i*rnd(26,40)*(ltr?-1:1),dy:Math.abs(i-n/2)*rnd(6,12),ph:rnd(0,6)});
  flocks.push({x:ltr?-60:Wd+60,y:y,v:(ltr?1:-1)*rnd(40,70),b:arr});
}
function shoot(){ shooters.push({x:rnd(Wd*.2,Wd),y:rnd(0,Ht*.3),vx:-rnd(380,560),vy:rnd(160,260),life:0,max:rnd(.7,1.1)}); }
function burst(x,y,col,n){
  if(RM.matches||cfg.mode==='off') return;
  for(var i=0;i<(n||30);i++){ var a=rnd(0,6.28), v=rnd(60,260); sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:0,max:rnd(.7,1.4),r:rnd(1.5,3.2),c:col||'#ffd978',conf:false}); }
}
function confetti(){
  if(RM.matches||cfg.mode==='off') return;
  var cols=['#f4b9c4','#f7d889','#ffffff','#e8a15a','#c7e0a8'];
  for(var i=0;i<90;i++){ sparks.push({x:rnd(0,Wd),y:rnd(-60,-5),vx:rnd(-40,40),vy:rnd(60,160),life:0,max:rnd(2.2,3.6),r:rnd(3,6),c:cols[i%cols.length],conf:true,rot:rnd(0,6.28),vr:rnd(-6,6)}); }
}

function fill(arr,target,fn){ while(arr.length<target) fn(); if(arr.length>target) arr.length=target; }

function frame(ts){
  if(!running) return;
  var dt=Math.min(.05,((ts||0)-last)/1000); last=ts||0; clock+=dt;
  var full=cfg.mode==='full';
  // parallax
  mx+=(tmx-mx)*.06; my+=(tmy-my)*.06;
  layers.forEach(function(l){ var d=parseFloat(l.getAttribute('data-d'))||1; l.style.transform='translate3d('+(mx*d*-9).toFixed(2)+'px,'+((my*d*-5)+(sy*d*-16)).toFixed(2)+'px,0)'; });
  if(full){ lx+=(tlx-lx)*.16; ly+=(tly-ly)*.16; lamp.style.transform='translate3d('+lx.toFixed(1)+'px,'+ly.toFixed(1)+'px,0)'; }
  // targets
  var w=FX_W[mood]||FX_W.dawn, sc=scale()*(full?1:.45), lt=isLight()?.5:1;
  fill(emb,Math.round(w.e*sc*lt),function(){spawnEmber(false)});
  fill(fly,Math.round(w.f*sc*lt),spawnFly);
  fill(mote,Math.round(w.m*sc),spawnMote);
  fill(petals,full?(COARSE?4:9):(cfg.mode==='calm'?3:0),function(){spawnPetal(false)});
  fctx.clearRect(0,0,Wd,Ht); tctx.clearRect(0,0,Wd,Ht);
  fctx.globalCompositeOperation='lighter';
  var i,p;
  for(i=0;i<emb.length;i++){ p=emb[i]; p.x+=(p.vx+Math.sin(clock*1.3+p.ph)*10)*dt; p.y+=p.vy*dt;
    if(p.y<-10){ p.y=Ht+10; p.x=rnd(0,Wd); }
    var fl=.55+.45*Math.sin(clock*5+p.ph);
    fctx.fillStyle='rgba(255,150,50,'+(p.a*fl*.18).toFixed(3)+')'; fctx.beginPath(); fctx.arc(p.x,p.y,p.r*4,0,6.283); fctx.fill();
    fctx.fillStyle='rgba(255,214,130,'+(p.a*fl).toFixed(3)+')'; fctx.beginPath(); fctx.arc(p.x,p.y,p.r,0,6.283); fctx.fill(); }
  for(i=0;i<fly.length;i++){ p=fly[i]; p.ph+=dt*p.sp; p.x+=Math.cos(p.ph*1.7)*18*dt; p.y+=Math.sin(p.ph*1.1)*14*dt;
    if(p.x<-20)p.x=Wd+20; if(p.x>Wd+20)p.x=-20; if(p.y<Ht*.3)p.y=Ht*.3; if(p.y>Ht+10)p.y=Ht*.5;
    var b=Math.pow((Math.sin(clock*p.bl+p.ph*3)+1)/2,2);
    fctx.fillStyle='rgba(200,255,140,'+(b*.2).toFixed(3)+')'; fctx.beginPath(); fctx.arc(p.x,p.y,p.r*5,0,6.283); fctx.fill();
    fctx.fillStyle='rgba(235,255,170,'+(b*.95).toFixed(3)+')'; fctx.beginPath(); fctx.arc(p.x,p.y,p.r,0,6.283); fctx.fill(); }
  for(i=0;i<mote.length;i++){ p=mote[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.x>Wd+5){p.x=-5;p.y=rnd(0,Ht);} if(p.y<-5)p.y=Ht; if(p.y>Ht+5)p.y=0;
    fctx.fillStyle='rgba(255,236,200,'+p.a.toFixed(3)+')'; fctx.beginPath(); fctx.arc(p.x,p.y,p.r,0,6.283); fctx.fill(); }
  fctx.globalCompositeOperation='source-over';
  // events (full only)
  if(full){
    tArrow-=dt; if(tArrow<=0){ volley(); tArrow=rnd(11,20); }
    tBird-=dt; if(tBird<=0){ if(mood!=='night'&&mood!=='lamp') flock(); tBird=rnd(14,26); }
    tShoot-=dt; if(tShoot<=0){ if(mood==='night') shoot(); tShoot=rnd(5,10); }
  }
  for(i=arrows.length-1;i>=0;i--){ var A=arrows[i], t=(clock-A.t0)/A.dur; if(t<0) continue; if(t>1.02){ arrows.splice(i,1); continue; }
    var pt=function(u){ return {x:A.x0+(A.x1-A.x0)*u,y:A.y0+(A.y1-A.y0)*u-4*A.h*u*(1-u)}; };
    var head=pt(Math.min(1,t)), tail;
    fctx.lineCap='round';
    for(var k=0;k<14;k++){ var u0=t-k*.012, u1=t-(k+1)*.012; if(u1<0) break; var a0=pt(u0), a1=pt(u1);
      fctx.strokeStyle='rgba(255,226,150,'+(.55*(1-k/14)).toFixed(3)+')'; fctx.lineWidth=2.2*(1-k/18); fctx.beginPath(); fctx.moveTo(a0.x,a0.y); fctx.lineTo(a1.x,a1.y); fctx.stroke(); }
    var pb=pt(Math.max(0,t-.02)), ang=Math.atan2(head.y-pb.y,head.x-pb.x);
    fctx.save(); fctx.translate(head.x,head.y); fctx.rotate(ang); fctx.fillStyle='#fff1c4'; fctx.beginPath(); fctx.moveTo(7,0); fctx.lineTo(-3,-3); fctx.lineTo(-3,3); fctx.closePath(); fctx.fill(); fctx.restore(); }
  for(i=flocks.length-1;i>=0;i--){ var F=flocks[i]; F.x+=F.v*dt; if(F.x<-120||F.x>Wd+120){ flocks.splice(i,1); continue; }
    fctx.strokeStyle=isLight()?'rgba(70,40,30,.7)':'rgba(20,10,10,.65)'; fctx.lineWidth=1.6; fctx.lineCap='round';
    F.b.forEach(function(bd){ var x=F.x+bd.dx, y=F.y+bd.dy+Math.sin(clock*.8+bd.ph)*6, fl=Math.sin(clock*9+bd.ph)*5;
      fctx.beginPath(); fctx.moveTo(x-9,y-fl); fctx.quadraticCurveTo(x-4,y-5+fl*.4,x,y); fctx.quadraticCurveTo(x+4,y-5+fl*.4,x+9,y-fl); fctx.stroke(); }); }
  for(i=shooters.length-1;i>=0;i--){ var S=shooters[i]; S.life+=dt; S.x+=S.vx*dt; S.y+=S.vy*dt; if(S.life>S.max){ shooters.splice(i,1); continue; }
    var al=1-S.life/S.max, g=fctx.createLinearGradient(S.x,S.y,S.x-S.vx*.14,S.y-S.vy*.14);
    g.addColorStop(0,'rgba(255,250,225,'+al.toFixed(3)+')'); g.addColorStop(1,'rgba(255,250,225,0)');
    fctx.strokeStyle=g; fctx.lineWidth=2; fctx.beginPath(); fctx.moveTo(S.x,S.y); fctx.lineTo(S.x-S.vx*.14,S.y-S.vy*.14); fctx.stroke(); }
  // top layer: petals + sparks
  for(i=0;i<petals.length;i++){ p=petals[i]; p.y+=p.vy*dt; p.x+=Math.sin(clock*p.sw+p.ph)*26*dt; p.rot+=p.vr*dt;
    if(p.y>Ht+20){ p.y=-20; p.x=rnd(0,Wd); }
    tctx.save(); tctx.translate(p.x,p.y); tctx.rotate(p.rot); tctx.globalAlpha=.5; tctx.fillStyle=p.hue; tctx.beginPath(); tctx.ellipse(0,0,p.r,p.r*.55,0,0,6.283); tctx.fill(); tctx.restore(); }
  for(i=sparks.length-1;i>=0;i--){ p=sparks[i]; p.life+=dt; if(p.life>p.max||p.y>Ht+30){ sparks.splice(i,1); continue; }
    p.vy+=(p.conf?40:300)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; var al2=1-p.life/p.max;
    tctx.globalAlpha=clamp(al2,0,1); tctx.fillStyle=p.c;
    if(p.conf){ p.rot+=p.vr*dt; tctx.save(); tctx.translate(p.x,p.y); tctx.rotate(p.rot); tctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r); tctx.restore(); }
    else { tctx.beginPath(); tctx.arc(p.x,p.y,p.r*al2+.4,0,6.283); tctx.fill(); } }
  tctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
function startLoop(){ if(running||RM.matches||cfg.mode==='off'||D.hidden) return; running=true; last=performance.now(); requestAnimationFrame(frame); }
function stopLoop(){ running=false; }
D.addEventListener('visibilitychange',function(){ if(D.hidden){ stopLoop(); try{mist.pause();}catch(e){} } else { startLoop(); playMist(); } });

  try{ if(want){ var pr=mist.play(); if(pr&&pr.catch) pr.catch(function(){}); } else mist.pause(); }catch(e){}
}

var Drone={ctx:null,master:null,on:false,timer:0,
  start:function(){
    var AC=W.AudioContext||W.webkitAudioContext; if(!AC) return;
    if(!this.ctx){
      var c=this.ctx=new AC(); this.master=c.createGain(); this.master.gain.value=0;
      var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;
      var dl=c.createDelay(1); dl.delayTime.value=.37; var fb=c.createGain(); fb.gain.value=.42; var wet=c.createGain(); wet.gain.value=.5;
      this.master.connect(lp); lp.connect(c.destination); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(c.destination);
    }
    this.ctx.resume(); var t=this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value,t); this.master.gain.linearRampToValueAtTime(.5,t+2.5);
    this.on=true; this.loop();
  },
  pluck:function(f,when){
    var c=this.ctx, g=c.createGain(); g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(.16,when+.012); g.gain.exponentialRampToValueAtTime(.0008,when+5.5); g.connect(this.master);
    for(var i=0;i<5;i++){ var o=c.createOscillator(); o.type=i?'sine':'sawtooth'; o.frequency.value=f*(i+1)*(1+(Math.random()-.5)*.0016);
      var og=c.createGain(); og.gain.value=i?.5/(i+1):.35; o.connect(og); og.connect(g); o.start(when); o.stop(when+5.8); }
  },
  loop:function(){
    if(!this.on) return; var me=this, c=this.ctx, t=c.currentTime+.05, Sa=146.83;
    [Sa*.75,Sa,Sa,Sa*.5].forEach(function(f,i){ me.pluck(f,t+i*1.25); });
    this.timer=setTimeout(function(){ me.loop(); },6200);
  },
  stop:function(){
    this.on=false; clearTimeout(this.timer); if(!this.ctx) return; var c=this.ctx, t=c.currentTime;
    this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value,t); this.master.gain.linearRampToValueAtTime(0,t+1.2);
    setTimeout(function(){ if(!Drone.on) try{ c.suspend(); }catch(e){} },1500);
  }
};

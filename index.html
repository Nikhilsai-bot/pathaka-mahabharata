<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pāṭhaka — Mahābhārata manuscript reader</title>
<meta name="description" content="Read Mahābhārata manuscript folios with a narrator, meet the characters, follow the timeline and take a quiz in English, Hindi, Tamil and Telugu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238c2a1b'/%3E%3Cpath d='M32 10 54 32 32 54 10 32Z' fill='none' stroke='%23e4c26a' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23e4c26a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif+Tamil:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   Pāṭhaka — design tokens
   Vellum pages, iron-gall ink, rubric red, lapis blue, gold leaf on a
   leather-bound desk.
   ========================================================================== */
:root{
  --vellum:#efe0b8; --vellum-hi:#f6ecd0; --vellum-lo:#dcc794;
  --ink:#2b1b0f; --ink-soft:#5b452d; --ink-faint:#7d6644;
  --rubric:#8c2a1b; --rubric-deep:#6a1d12;
  --lapis:#2c3e6d; --ochre:#8a5e16; --moss:#3f5224; --umber:#5a3b22;
  --gold:#c29a3c; --gold-hi:#e8c973;
  --leather:#21140e; --leather-hi:#3a251a;

  /* desk (outside the book) — redefined for light / dark below */
  --desk-bg:#21140e; --desk-glow:rgba(120,70,30,.35); --desk-shade:rgba(0,0,0,.6);
  --desk-head:#e8c973; --desk-text:#cdb487; --desk-line:rgba(232,201,115,.35);

  --latin:"IM Fell English","Gentium Book Plus","Noto Serif Devanagari","Noto Serif Tamil","Noto Serif Telugu","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Nirmala UI","Kohinoor Devanagari",serif;

  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  --lozenge:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15'><path d='M7.5 1 14 7.5 7.5 14 1 7.5Z' fill='%23efe0b8' stroke='%238c2a1b' stroke-width='1.4'/><circle cx='7.5' cy='7.5' r='1.6' fill='%238c2a1b'/></svg>");
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --desk-bg:#cdb98f; --desk-glow:rgba(255,240,200,.55); --desk-shade:rgba(90,59,34,.35);
    --desk-head:#5a1d12; --desk-text:#4a3822; --desk-line:rgba(90,29,18,.45);
  }
}
:root[data-theme="light"]{
  --desk-bg:#cdb98f; --desk-glow:rgba(255,240,200,.55); --desk-shade:rgba(90,59,34,.35);
  --desk-head:#5a1d12; --desk-text:#4a3822; --desk-line:rgba(90,29,18,.45);
}

*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:var(--latin); font-size:17px; line-height:1.55;
  background:
    radial-gradient(ellipse at 50% 0%, var(--desk-glow), transparent 60%),
    radial-gradient(ellipse at 50% 120%, var(--desk-shade), transparent 60%),
    var(--grain), var(--desk-bg);
  background-color:var(--desk-bg);
}
html[lang="hi"] body,html[lang="ta"] body,html[lang="te"] body{line-height:1.8}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rubric)}
:focus-visible{outline:2px solid var(--rubric); outline-offset:3px; border-radius:2px}
.desk-bar :focus-visible,.desk-foot :focus-visible{outline-color:var(--gold-hi)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
.skip{position:absolute;left:8px;top:-60px;background:var(--rubric);color:#fff;padding:8px 12px;z-index:100;border-radius:3px}
.skip:focus{top:8px}

/* ---------- desk bar ---------- */
.desk-bar{
  max-width:1320px; margin:0 auto; padding:22px 24px 8px;
  display:grid; grid-template-columns:1fr auto; gap:14px 20px; align-items:end;
}
.brand h1{
  margin:0; font-weight:400; line-height:1.05; color:var(--desk-head);
  font-size:clamp(34px,4.6vw,54px);
  text-shadow:0 1px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.25);
  display:flex; align-items:baseline; gap:.5em; flex-wrap:wrap;
}
.brand .deva{font-family:var(--deva); font-size:.62em; color:var(--gold)}
.brand p{margin:6px 0 0; font-style:italic; color:var(--desk-text); font-size:1.02rem}
.desk-tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.desk-nav{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--desk-line); padding-top:12px}

.brass,.nav-link{
  cursor:pointer; padding:.45em 1.1em; border-radius:3px; color:var(--ink); text-decoration:none;
  background:linear-gradient(#ecce7d,#bb8d33);
  border:1px solid #6b4a12; display:inline-block; line-height:1.4;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 2px 5px rgba(0,0,0,.35);
}
.brass:hover,.nav-link:hover{background:linear-gradient(#f4d98f,#c89a3d)}
.brass:active{transform:translateY(1px)}
.nav-link[aria-current="page"]{background:linear-gradient(#8c2a1b,#6a1d12); color:var(--gold-hi); border-color:#3d0f08}
.lang-sel{
  padding:.42em .7em; border-radius:3px; border:1px solid #6b4a12; background:var(--vellum-hi); color:var(--ink); cursor:pointer;
}
.hello{color:var(--desk-text); font-style:italic}

/* ---------- the book ---------- */
.book{
  position:relative; max-width:1320px; margin:12px auto 0; padding:16px 18px 22px;
  border-radius:12px;
  background:var(--grain), linear-gradient(145deg,#4d2e1f,#2a1810 60%,#1d110b);
  box-shadow:0 40px 90px -10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(232,201,115,.18), inset 0 2px 0 rgba(255,255,255,.06);
  width:calc(100% - 24px);
}
.book::before{content:""; position:absolute; inset:6px; border:1px solid rgba(232,201,115,.35); border-radius:8px; pointer-events:none}
.spread{
  display:grid; grid-template-columns:1fr 1fr; height:min(82vh,880px); min-height:620px; border-radius:5px;
  box-shadow:0 1px 0 #cdb888, 0 2px 0 #a88f58, 0 3px 0 #d5c394, 0 4px 0 #9d8450, 0 5px 0 #cbb683, 0 6px 0 #8f7646, 0 18px 30px rgba(0,0,0,.45);
}
.spread.single{grid-template-columns:1fr}
.page{
  position:relative; min-width:0; display:flex; flex-direction:column; color:var(--ink);
  background:
    radial-gradient(ellipse at 16% 10%, rgba(150,100,40,.20), transparent 38%),
    radial-gradient(ellipse at 84% 90%, rgba(120,80,30,.24), transparent 42%),
    var(--grain),
    linear-gradient(100deg,var(--vellum-hi),var(--vellum) 45%,var(--vellum-lo));
  background-color:var(--vellum);
  box-shadow:inset 0 0 70px rgba(110,70,25,.38), inset 0 0 5px rgba(80,50,20,.55);
}
.page-left{border-radius:5px 0 0 5px}
.page-right{border-radius:0 5px 5px 0}
.spread.single .page{border-radius:5px}
.spread:not(.single) .page-left::after,.spread:not(.single) .page-right::before{content:""; position:absolute; top:0; bottom:0; width:54px; pointer-events:none; z-index:2}
.spread:not(.single) .page-left::after{right:0; background:linear-gradient(to right,transparent,rgba(70,40,12,.34))}
.spread:not(.single) .page-right::before{left:0; background:linear-gradient(to left,transparent,rgba(70,40,12,.34))}

.frame{
  position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
  margin:28px 30px 26px; padding:16px 22px 14px;
  border:1px solid rgba(140,42,27,.75); outline:1px solid rgba(140,42,27,.4); outline-offset:4px;
}
.frame::before{
  content:""; position:absolute; inset:-9px; pointer-events:none;
  background:var(--lozenge) left top/15px 15px no-repeat, var(--lozenge) right top/15px 15px no-repeat,
             var(--lozenge) left bottom/15px 15px no-repeat, var(--lozenge) right bottom/15px 15px no-repeat;
}
.runhead{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding-bottom:8px; margin-bottom:12px; border-bottom:1px solid rgba(140,42,27,.45);
  font-style:italic; color:var(--ink-soft); font-size:.98rem;
}
.runhead .title{color:var(--rubric); font-style:normal}
.scroll{flex:1; min-height:0; overflow:auto; padding-right:8px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(140,42,27,.4); border-radius:4px}

h2.folio-title{margin:.1em 0 .5em; font-weight:400; font-size:clamp(26px,2.6vw,34px); line-height:1.25; color:var(--rubric-deep)}
h3{margin:0 0 .3em; font-weight:400; color:var(--rubric-deep); font-size:1.25rem}
p{margin:0 0 .8em}

/* ---------- buttons ---------- */
.seal{
  cursor:pointer; padding:.6em 1.5em; border-radius:3px; color:var(--gold-hi); border:1px solid #3d0f08;
  background:linear-gradient(#a53a28,#6a1d12); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 2px 5px rgba(0,0,0,.4);
}
.seal:hover{background:linear-gradient(#b5442f,#7a2316)}
.seal:active{transform:translateY(1px)}
.quiet{
  cursor:pointer; padding:.5em 1.1em; border-radius:3px; background:transparent; color:var(--rubric-deep);
  border:1px solid rgba(140,42,27,.65);
}
.quiet:hover{background:rgba(140,42,27,.1)}
.quiet.small,.seal.small{padding:.3em .85em; font-size:.92rem}
.linkbtn{background:none;border:0;padding:0;color:var(--rubric);text-decoration:underline;cursor:pointer}

/* ---------- reader ---------- */
.verse{margin:.2em 0 .6em; padding:12px 16px; border-left:3px solid var(--rubric); background:rgba(140,42,27,.07)}
.verse .dev{font-family:var(--deva); font-size:clamp(20px,2vw,25px); line-height:1.9; color:var(--rubric); margin:0}
.verse .iast{font-style:italic; color:var(--ink-soft); margin:.3em 0 0; font-size:.98rem}
.meaning{color:var(--ink-soft); padding:4px 16px; margin-bottom:1em}
.lab{font-style:italic; color:var(--rubric); margin-right:.4em}
.story{font-size:1.12rem; margin:0}
.sent{border-radius:3px; transition:background-color .2s, box-shadow .2s; padding:1px 0}
.speaking{background-color:rgba(194,154,60,.42); box-shadow:0 0 0 3px rgba(194,154,60,.42)}
.folio-nav{display:flex; justify-content:space-between; gap:10px; margin-top:1.2em}

.narr{border:1px solid rgba(140,42,27,.45); padding:14px 16px; margin-bottom:16px; background:rgba(255,255,255,.14)}
.narr h3{display:flex; align-items:center; gap:.5em}
.narr h3::before{content:""; width:15px; height:15px; background:var(--lozenge) center/15px 15px no-repeat}
.narr-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0}
.ctl{display:grid; gap:4px; margin:10px 0; font-size:.98rem}
.ctl span{color:var(--ink-soft); font-style:italic}
.ctl input[type=range]{width:100%; accent-color:var(--rubric)}
.inp,select.inp{
  width:100%; padding:.45em .6em; background:var(--vellum-hi); border:1px solid rgba(90,59,34,.55); border-radius:3px; color:var(--ink);
}
.check{display:flex; gap:.55em; align-items:center; margin:6px 0; cursor:pointer}
.check input{accent-color:var(--rubric); width:1.05em; height:1.05em}
.note{color:var(--ink-soft); font-size:.94rem; font-style:italic}
.warn{border-left:3px solid var(--ochre); padding:6px 10px; background:rgba(168,116,31,.12); font-size:.95rem; margin:8px 0}
.progress{color:var(--ink-faint); font-size:.95rem; min-width:4.5em}

.index{list-style:none; margin:0; padding:0}
.index li+li{margin-top:6px}
.index button{
  width:100%; text-align:left; cursor:pointer; padding:.5em .8em; background:transparent; border:1px solid rgba(90,59,34,.35); border-radius:3px;
  display:grid; grid-template-columns:auto 1fr; gap:.2em .8em; align-items:baseline;
}
.index button:hover{background:rgba(140,42,27,.08)}
.index button[aria-current="true"]{background:rgba(140,42,27,.14); border-color:var(--rubric)}
.index .n{color:var(--rubric); font-style:italic}
.index .p{grid-column:2; color:var(--ink-faint); font-size:.9rem; font-style:italic}

/* ---------- characters ---------- */
.lede{color:var(--ink-soft); font-style:italic; margin-bottom:1em}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{cursor:pointer; padding:.3em .9em; border-radius:99px; border:1px solid rgba(140,42,27,.6); background:transparent; color:var(--rubric-deep)}
.chip[aria-pressed="true"]{background:var(--rubric); color:var(--gold-hi); border-color:var(--rubric-deep)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
.char{
  cursor:pointer; text-align:center; padding:14px 10px 12px; background:rgba(255,255,255,.16);
  border:1px solid rgba(90,59,34,.5); outline:1px solid rgba(90,59,34,.25); outline-offset:3px; border-radius:2px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.char:hover{background:rgba(255,255,255,.3)}
.medal{position:relative; width:78px; height:78px; display:grid; place-items:center; color:var(--rubric)}
.medal svg{position:absolute; inset:0; width:100%; height:100%}
.medal span{position:relative; font-family:var(--deva); font-size:1.5rem; color:var(--rubric-deep); line-height:1}
.char[data-g="pandava"] .medal{color:var(--lapis)}
.char[data-g="elders"] .medal{color:var(--ochre)}
.char .nm{font-size:1.2rem; color:var(--ink); line-height:1.2}
.char .dv{font-family:var(--deva); color:var(--rubric); font-size:1rem}
.char .rl{color:var(--ink-soft); font-size:.9rem; font-style:italic; line-height:1.4}

/* ---------- timeline ---------- */
.tl{list-style:none; margin:0; padding:0 0 0 40px; position:relative}
.tl::before{content:""; position:absolute; left:11px; top:8px; bottom:8px; width:2px; background:var(--rubric); opacity:.7}
.tl li{position:relative; padding:4px 10px 16px; border-radius:3px}
.tl li::before{content:""; position:absolute; left:-37px; top:8px; width:15px; height:15px; background:var(--lozenge) center/15px 15px no-repeat}
.tl .pv{color:var(--rubric); font-style:italic; font-size:.95rem}
.tl h3{margin:.1em 0 .2em}
.tl p{margin:0 0 .4em; color:var(--ink)}
.tl-top{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}

/* ---------- quiz ---------- */
.q-count{color:var(--rubric); font-style:italic; margin-bottom:.4em}
.q-text{font-size:1.4rem; line-height:1.4; margin:0 0 1em; color:var(--rubric-deep)}
.opts{display:grid; gap:10px}
.opt{
  cursor:pointer; text-align:left; padding:.7em 1em; background:rgba(255,255,255,.18); border:1px solid rgba(90,59,34,.55); border-radius:3px;
  display:flex; gap:.7em; align-items:baseline; font-size:1.08rem;
}
.opt:hover:not(:disabled){background:rgba(255,255,255,.4)}
.opt:disabled{cursor:default}
.opt .mk{width:1.2em; text-align:center; font-weight:700}
.opt.ok{border-color:var(--moss); background:rgba(75,91,46,.2); box-shadow:inset 3px 0 0 var(--moss)}
.opt.no{border-color:var(--rubric); background:rgba(140,42,27,.14); box-shadow:inset 3px 0 0 var(--rubric)}
.explain{margin-top:14px; padding:10px 14px; border-left:3px solid var(--gold); background:rgba(194,154,60,.14)}
.bigscore{font-size:2.2rem; color:var(--rubric); margin:.1em 0}
.hist{list-style:none; padding:0; margin:0}
.hist li{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dotted rgba(90,59,34,.45)}
.gate{max-width:520px; margin:6% auto 0; text-align:center}

/* ---------- about ---------- */
.maker{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; margin-bottom:12px}
.avatar{
  width:112px; height:112px; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  border:2px solid var(--rubric); outline:1px solid rgba(140,42,27,.4); outline-offset:3px; background:rgba(255,255,255,.2);
  font-size:2.6rem; color:var(--rubric);
}
.avatar img{width:100%; height:100%; object-fit:cover}
.maker h3{font-size:1.5rem; margin:0}
.role{color:var(--rubric); font-style:italic; margin-bottom:.5em}
.maker-links{display:flex; gap:14px; flex-wrap:wrap; margin:.4em 0 1em}
.bio{white-space:pre-line}


.team{list-style:none; margin:0; padding:0; display:grid; gap:14px}
.member{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; padding:14px 16px; border:1px solid rgba(140,42,27,.35); border-radius:4px; background:rgba(255,255,255,.18)}
.member .avatar{width:68px; height:68px; font-size:1.9rem}
.member h3{font-size:1.25rem; margin:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.member .role{margin:.1em 0 .4em}
.member .bio{margin:0}
.member.lead{border-color:var(--gold); box-shadow:inset 0 0 0 1px rgba(194,154,60,.5), 0 0 18px rgba(194,154,60,.22)}
.member.lead .avatar{border-color:var(--gold); color:var(--ochre)}
.lead-tag{font-size:.78rem; font-weight:400}
@media (max-width:560px){ .member{grid-template-columns:1fr} }

/* ---------- dialog ---------- */
dialog.slip{
  width:min(92vw,480px); max-height:88vh; padding:0; border:1px solid var(--rubric); border-radius:4px; color:var(--ink);
  background:var(--grain), linear-gradient(100deg,var(--vellum-hi),var(--vellum) 45%,var(--vellum-lo)); background-color:var(--vellum);
  box-shadow:0 30px 70px rgba(0,0,0,.6);
}
dialog.slip.wide{width:min(94vw,640px)}
dialog.slip::backdrop{background:rgba(20,10,5,.7)}
.slipbody{padding:22px 24px; overflow:auto; max-height:86vh}
.slipbody h2{margin:0 0 .4em; font-weight:400; color:var(--rubric-deep); font-size:1.7rem}
.field{display:grid; gap:4px; margin:10px 0}
.field span{color:var(--ink-soft); font-style:italic; font-size:.97rem}
.err{color:var(--rubric); min-height:1.4em; margin:6px 0; font-weight:700}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
.switch{margin-top:14px; color:var(--ink-soft)}
.dev-sub{font-family:var(--deva); color:var(--rubric); margin:0 0 .3em}
.tag{display:inline-block; padding:.05em .7em; border:1px solid rgba(140,42,27,.5); border-radius:99px; color:var(--rubric); font-size:.9rem; margin-right:6px}


/* ---------- folio reader (original tool, embedded as-is) ---------- */
.reader-wrap{max-width:1320px; margin:12px auto 0; width:calc(100% - 24px)}
.reader-note{margin:0 0 10px; padding:0 4px; color:var(--desk-text); font-style:italic}
.reader-frame{display:block; width:100%; height:100vh; height:100dvh; border:0; border-radius:12px; background:#21140e; box-shadow:0 30px 70px -10px rgba(0,0,0,.6)}

/* ---------- footer, toast ---------- */
.desk-foot{max-width:1320px; margin:18px auto 0; padding:6px 24px 36px; color:var(--desk-text); font-style:italic; font-size:.95rem; text-align:center}
.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60;
  background:var(--rubric-deep); color:var(--gold-hi); padding:.6em 1.2em; border-radius:3px; border:1px solid var(--gold);
  box-shadow:0 8px 24px rgba(0,0,0,.5); max-width:90vw; text-align:center;
}

/* ---------- small screens ---------- */
@media (max-width:880px){
  .desk-bar{grid-template-columns:1fr; padding:16px 16px 6px}
  .desk-tools{justify-content:flex-start}
  .book{padding:10px 8px 14px}
  .spread{grid-template-columns:1fr; height:auto; min-height:0}
  .page-left{border-radius:5px 5px 0 0}
  .page-right{border-radius:0 0 5px 5px}
  .spread:not(.single) .page-left::after,.spread:not(.single) .page-right::before{display:none}
  .frame{margin:20px 18px 20px; padding:14px 14px 12px}

:root{

}

.viewport canvas{position:absolute; top:0; left:0; transform-origin:0 0; max-width:none}
.viewer-tools{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  display:flex; gap:2px; padding:4px; border-radius:4px;
  background:rgba(33,20,14,.82); border:1px solid rgba(232,201,115,.35); backdrop-filter:blur(3px);
}
.viewer-tools button{
  min-width:34px; height:30px; padding:0 8px; cursor:pointer; background:transparent; border:0; border-radius:3px;
  color:var(--gold-hi); font-size:.95rem;
}
.viewer-tools button:hover{background:rgba(232,201,115,.18)}
.viewer-tools .zoom-read{align-self:center; min-width:46px; text-align:center; color:#cdb487; font-size:.85rem; font-style:italic}

details.adjust{margin-top:10px; border-top:1px solid rgba(140,42,27,.3); padding-top:8px}
details.adjust summary{cursor:pointer; color:var(--rubric); font-style:italic}
.adjust-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 22px; margin-top:8px; align-items:center}
.adjust-grid label{display:flex; align-items:center; gap:10px; font-size:.95rem; color:var(--ink-soft)}
.adjust-grid input[type=range]{flex:1; accent-color:var(--rubric); min-width:60px}
.adjust-grid .check{gap:8px}
.adjust-grid input[type=checkbox]{accent-color:var(--rubric); width:16px; height:16px}
.adjust-actions{grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px}

.fields{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:12px; margin-top:10px}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field>span{font-style:italic; color:var(--ink-soft); font-size:.92rem}
.field select,.field input,.slip select,.slip input[type=text],.slip input[type=password],.slip input[type=url]{
  width:100%; padding:.4em .6em; background:rgba(255,250,232,.55); border:1px solid rgba(91,69,45,.55); border-radius:2px;
}
.field select:focus,.field input:focus{background:rgba(255,250,232,.9)}

.strip{display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:thin}
.thumb{
  position:relative; flex:0 0 auto; width:54px; height:54px; padding:0; cursor:pointer;
  border:2px solid transparent; background:#1c120c; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block; opacity:.85}
.thumb[aria-current=true]{border-color:var(--rubric)}
.thumb[aria-current=true] img{opacity:1}
.thumb .dot{position:absolute; right:3px; bottom:3px; width:11px; height:11px; border-radius:50%; border:1.5px solid var(--vellum-hi); background:transparent}
.thumb .dot.done{background:var(--moss)} .thumb .dot.error{background:var(--rubric)}
.thumb .dot.reading{background:var(--gold); animation:pulse 1s ease-in-out infinite}
.thumb .rm{
  position:absolute; top:-6px; right:-6px; width:18px; height:18px; line-height:15px; padding:0; border-radius:50%;
  background:var(--ink); color:var(--vellum-hi); border:1px solid var(--vellum-hi); font-size:.8rem; cursor:pointer; display:none;
}
.thumb:hover .rm,.thumb:focus-within .rm{display:block}
.thumb.add{display:grid; place-items:center; background:transparent; border:1.5px dashed rgba(91,69,45,.7); color:var(--ink-soft); font-size:1.4rem}
.thumb.add:hover{border-color:var(--rubric); color:var(--rubric)}

.read-row{display:flex; gap:10px; margin-top:8px; align-items:center; flex-wrap:wrap}
.read-row .hint{font-style:italic; color:var(--ink-soft); font-size:.9rem}

.seal,.quiet{cursor:pointer; padding:.55em 1.3em; border-radius:3px}
.seal{
  color:var(--vellum-hi); border:1px solid #4a1209;
  background:radial-gradient(circle at 30% 25%,#b3412c,#7a2013 70%);
  box-shadow:inset 0 0 0 3px rgba(246,236,208,.16), 0 2px 4px rgba(60,20,10,.45);
}
.seal:hover:not(:disabled){background:radial-gradient(circle at 30% 25%,#c14b35,#862616 70%)}
.seal:disabled{opacity:.45; cursor:not-allowed}
.quiet{background:transparent; border:1px solid var(--ink-faint); color:var(--ink)}
.quiet:hover:not(:disabled){border-color:var(--rubric); color:var(--rubric)}
.quiet:disabled{opacity:.45; cursor:not-allowed}
.quiet.small{padding:.2em .7em; font-size:.9rem}

/* ---------- right page ---------- */
.ribbons{position:relative; z-index:3; display:flex; gap:8px; padding:0 40px; margin-bottom:-22px; flex-wrap:nowrap; overflow:visible}
.ribbon{
  cursor:pointer; border:0; padding:12px 14px 26px; color:var(--vellum-hi); font-size:.98rem;
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 11px),0 100%);
  background:var(--c); box-shadow:0 0 0 1px rgba(0,0,0,.15);
  transition:padding-bottom .18s ease, filter .15s;
  filter:saturate(.8) brightness(.95);
}
.ribbon:nth-child(1){--c:var(--rubric)} .ribbon:nth-child(2){--c:var(--lapis)} .ribbon:nth-child(3){--c:var(--ochre)}
.ribbon:nth-child(4){--c:var(--moss)} .ribbon:nth-child(5){--c:var(--umber)}
.ribbon[aria-selected=true]{padding-bottom:38px; filter:none}
.ribbon:hover:not(:disabled){filter:none}
.ribbon:disabled{cursor:default; opacity:.55}

.sheet{flex:1; min-height:0; overflow:auto; padding:2px 6px 10px 2px; scrollbar-width:thin; scrollbar-color:rgba(140,42,27,.5) transparent}
.sheet:focus-visible{outline-offset:2px}

.page-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; padding-top:10px; margin-top:6px; border-top:1px solid rgba(140,42,27,.35)}

.lines{list-style:none; margin:0; padding:0}
.lines li{display:grid; grid-template-columns:2.6em minmax(0,1fr); align-items:baseline}
.lines .ln{color:var(--lapis); font-size:.88rem; text-align:right; padding-right:.9em; user-select:none}
.lines .tx{display:block; padding:.05em .3em; border-radius:2px; outline:none; overflow-wrap:anywhere}
.lines .tx:hover{background:rgba(255,250,232,.35)}
.lines .tx:focus{background:rgba(255,250,232,.7); box-shadow:0 0 0 1px rgba(140,42,27,.5)}
.lines.sanskrit .tx{font-family:var(--deva); font-size:1.5rem; line-height:2}
.lines.written .tx{font-family:var(--indic); font-size:1.45rem; line-height:2}
.lines.roman .tx{font-family:var(--roman); font-style:italic; font-size:1.14rem; line-height:1.95}
.lines .empty{color:var(--ink-faint)}
.conf-low .tx{text-decoration:underline dotted var(--rubric) 2px; text-underline-offset:.32em}
.conf-medium .tx{text-decoration:underline solid rgba(140,42,27,.28) 1px; text-underline-offset:.32em}
.legend{margin:14px 0 0; font-style:italic; font-size:.92rem; color:var(--ink-soft)}
.writing li{animation:inkin .7s ease-out both; animation-delay:var(--d,0s)}
@keyframes inkin{from{opacity:0; clip-path:inset(0 100% 0 0)} to{opacity:1; clip-path:inset(0 0 0 0)}}
@keyframes pulse{50%{opacity:.35}}

.translation{
  font-size:1.22rem; line-height:1.8; text-align:justify; hyphens:auto; white-space:pre-wrap; outline:none;
  padding:2px 6px; border-radius:2px; overflow-wrap:anywhere;
}
.translation:focus{background:rgba(255,250,232,.55)}
.translation::first-letter{
  float:left; font-size:3.7em; line-height:.82; padding:.06em .1em 0 0; color:var(--rubric); font-family:var(--latin);
}
.translation.indic{font-family:var(--indic); font-size:1.15rem; line-height:1.95; text-align:left}
.translation.indic::first-letter{float:none; font-size:inherit; padding:0; color:inherit}

.facts{display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0 0 4px; padding:10px 14px; border:1px solid rgba(140,42,27,.4); background:rgba(255,250,232,.3)}
.facts dt{font-style:italic; color:var(--rubric)}
.facts dd{margin:0; overflow-wrap:anywhere}
.notes h3{margin:18px 0 6px; font-weight:400; font-size:1.3rem; color:var(--rubric)}
.notes ul{margin:0; padding:0; list-style:none}
.notes li{position:relative; padding:4px 0 4px 22px}
.notes li::before{content:""; position:absolute; left:2px; top:.72em; width:8px; height:8px; background:var(--rubric); transform:rotate(45deg)}
.notes .none{font-style:italic; color:var(--ink-soft)}

/* invocation (empty state) */
.invocation{text-align:center; padding:6px 4px}
.invocation .rubric{font-family:var(--deva); font-size:1.65rem; line-height:1.95; color:var(--rubric); margin:6px 0 2px}
.invocation .roman{font-family:var(--roman); font-style:italic; color:var(--ink-soft); margin:0 0 8px; font-size:1.05rem; line-height:1.7}
.invocation .gloss{max-width:46ch; margin:0 auto; color:var(--ink-soft); font-size:1.05rem}
.invocation .ornament{display:block; width:200px; height:18px; margin:14px auto; color:var(--rubric)}
.invocation ol{max-width:42ch; margin:6px auto 0; padding:0; list-style:none; text-align:left; counter-reset:s}
.invocation ol li{counter-increment:s; position:relative; padding:5px 0 5px 2.2em}
.invocation ol li::before{content:counter(s); position:absolute; left:0; top:.2em; width:1.5em; height:1.5em; text-align:center; line-height:1.5em; color:var(--lapis); border:1px solid var(--lapis); border-radius:50%; font-size:.85rem}
.invocation .cta{margin-top:12px}

.reading-view{padding:10px 4px}
.reading-view h3{margin:0 0 4px; font-weight:400; font-size:1.5rem; color:var(--rubric)}
.reading-view p{margin:0 0 18px; font-style:italic; color:var(--ink-soft)}
.ink-line{height:11px; margin:20px 0; border-radius:6px; background:linear-gradient(90deg,rgba(43,27,15,.12) 0%,rgba(43,27,15,.55) 50%,rgba(43,27,15,.12) 100%); background-size:220% 100%; animation:flow 1.8s linear infinite}
.ink-line:nth-of-type(2){width:88%} .ink-line:nth-of-type(3){width:94%; animation-delay:-.5s} .ink-line:nth-of-type(4){width:72%; animation-delay:-1s}
@keyframes flow{from{background-position:120% 0} to{background-position:-100% 0}}

.error-view{padding:8px 4px}
.error-view h3{margin:0 0 6px; font-weight:400; font-size:1.5rem; color:var(--rubric)}
.error-view p{margin:0 0 10px}
.error-view .detail{font-size:.88rem; color:var(--ink-soft); font-style:italic; overflow-wrap:anywhere; max-height:7em; overflow:auto}

.desk-foot{max-width:1320px; margin:0 auto; padding:16px 24px 34px; text-align:center; color:#b69d73; font-style:italic; font-size:.95rem}

/* ---------- dialogs (slips of vellum) ---------- */
dialog.slip{
  width:min(560px,calc(100vw - 28px)); max-height:calc(100vh - 28px); padding:0; border:0; border-radius:4px; color:var(--ink);
  background:var(--grain), linear-gradient(110deg,var(--vellum-hi),var(--vellum) 55%,var(--vellum-lo));
  box-shadow:inset 0 0 50px rgba(110,70,25,.35), 0 30px 80px rgba(0,0,0,.7);
}
dialog.slip.wide{width:min(760px,calc(100vw - 28px))}
dialog.slip::backdrop{background:rgba(20,10,5,.72); backdrop-filter:blur(2px)}
.slip-body{margin:16px; padding:18px 22px 16px; border:1px solid rgba(140,42,27,.7); outline:1px solid rgba(140,42,27,.35); outline-offset:4px}
.slip h2{margin:0 0 4px; font-weight:400; font-size:1.8rem; color:var(--rubric)}
.slip .lede{margin:0 0 14px; font-style:italic; color:var(--ink-soft)}
.slip fieldset{margin:0 0 12px; padding:0; border:0}
.slip legend{padding:0; font-style:italic; color:var(--ink-soft); margin-bottom:4px}
.slip label.row{display:block; margin:0 0 10px}
.slip label.row>span{display:block; font-style:italic; color:var(--ink-soft); font-size:.95rem; margin-bottom:2px}
.slip .inline{display:flex; gap:8px}
.slip .inline>input{flex:1}
.slip .choice{display:flex; align-items:center; gap:8px; margin:3px 0}
.slip input[type=radio],.slip input[type=checkbox]{accent-color:var(--rubric); width:16px; height:16px}
.slip .help{margin:2px 0 0; font-size:.9rem; color:var(--ink-soft)}
.slip .status{min-height:1.5em; margin:6px 0 0; font-style:italic}
.slip .status.ok{color:var(--moss)} .slip .status.bad{color:var(--rubric)}
.slip-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap}

.shelf-list{display:grid; gap:10px; margin:6px 0 0}
.shelf-item{display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center; padding:8px; border:1px solid rgba(91,69,45,.4); background:rgba(255,250,232,.3)}
.shelf-item img{width:64px; height:64px; object-fit:cover; background:#1c120c; display:block}
.shelf-item h3{margin:0; font-weight:400; font-size:1.15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.shelf-item p{margin:0; font-size:.9rem; font-style:italic; color:var(--ink-soft)}
.shelf-item .acts{display:flex; gap:6px}
.shelf-empty{font-style:italic; color:var(--ink-soft); padding:14px 0}

/* toast */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); opacity:0; pointer-events:none; z-index:50;
  max-width:min(520px,calc(100vw - 28px)); padding:.7em 1.2em; border-radius:3px;
  background:var(--vellum-hi); color:var(--ink); border:1px solid var(--rubric); box-shadow:0 10px 30px rgba(0,0,0,.6);
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- small screens ---------- */
@media (max-width:920px){
  .book{padding:10px 8px 14px; margin:8px 6px 0; border-radius:8px}
  .spread{grid-template-columns:1fr; height:auto; min-height:0}
  .page-left,.page-right{border-radius:4px}
  .page-left::after,.page-right::before{display:none}
  .page-left{margin-bottom:10px}
  .frame{margin:20px 14px 18px; padding:12px 12px 10px}
  .page-right .frame{margin-top:34px}
  .plate{flex:none; height:min(60vh,460px)}
  .sheet{max-height:none; overflow:visible}
  .ribbons{padding:0 16px; overflow-x:auto; overflow-y:hidden; padding-bottom:0}
  .fields,.adjust-grid{grid-template-columns:1fr}
  .lines.sanskrit .tx,.lines.written .tx{font-size:1.3rem}
  .desk-bar{padding:16px 14px 4px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}

/* ---------- print: just the active text ---------- */
@media print{
  body{background:#fff; color:#000}
  .desk-bar,.desk-foot,.page-left,.ribbons,.page-actions,.toast{display:none !important}
  .book{padding:0; background:none; box-shadow:none; margin:0}
  .book::before,.page-right::before,.frame::before{display:none}
  .spread{display:block; height:auto; box-shadow:none}
  .page{background:none; box-shadow:none}
  .frame{margin:0; border:0; outline:0}
  .sheet{overflow:visible}
  .writing li{animation:none}
}
</style>
<style id="amb-reader-css">
/* ===== Ambience: shared polish (shell + embedded reader) ===== */
@keyframes amb-shine{from{background-position:220% 0}to{background-position:-120% 0}}
@keyframes amb-sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes amb-glow{0%,100%{text-shadow:0 0 6px rgba(232,201,115,.25)}50%{text-shadow:0 0 18px rgba(255,214,120,.85),0 0 34px rgba(255,170,60,.35)}}
.brand h1>span:first-child{
  background:linear-gradient(100deg,var(--desk-head,#e8c973) 28%,#fff6cf 46%,var(--desk-head,#e8c973) 64%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));animation:amb-shine 9s linear infinite;
}
.brand .deva{animation:amb-glow 5.5s ease-in-out infinite}
.brass,.seal,.nav-link{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .25s ease,background .25s ease}
.brass::after,.seal::after,.nav-link::after{
  content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-130%);
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%);
}
.brass:hover::after,.seal:hover::after,.nav-link:hover::after{animation:amb-sweep .8s ease}
.brass:hover:not(:disabled),.seal:hover:not(:disabled),.nav-link:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px rgba(0,0,0,.4),0 0 14px rgba(232,201,115,.35)}
@keyframes amb-rise{from{opacity:0;transform:perspective(1800px) translateY(28px) rotateX(5deg)}to{opacity:1;transform:none}}
@keyframes amb-unfold{0%{opacity:.15;transform:perspective(2400px) rotateY(-84deg);filter:brightness(.55)}55%{opacity:1}100%{opacity:1;transform:none;filter:none}}
@keyframes amb-ink{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes amb-pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes amb-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes amb-spin{to{transform:rotate(360deg)}}
@keyframes amb-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,201,115,.0)}50%{box-shadow:0 0 16px 2px rgba(232,201,115,.55)}}
@media (prefers-reduced-motion:reduce){
  .brand h1>span:first-child,.brand .deva{animation:none}
  .brass:hover::after,.seal:hover::after,.nav-link:hover::after{animation:none}
}

/* ===== Ambience: embedded reader entrance ===== */
.spread{animation:amb-rise .8s cubic-bezier(.2,.7,.2,1) both}
.page-right{transform-origin:left center;animation:amb-unfold 1.1s cubic-bezier(.22,.8,.22,1) both}
.folio-thumb,.thumb{animation:amb-pop .5s both}
@media (prefers-reduced-motion:reduce){.spread,.page-right,.folio-thumb,.thumb{animation:none}}

</style>

<body>
<!-- Shared ornaments -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="orn-divider" viewBox="0 0 200 18">
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <path d="M2 9H82M118 9h80"/>
      <path d="M100 1l8 8-8 8-8-8z"/>
      <path d="M100 5.5l3.5 3.5-3.5 3.5L96.500 9z" fill="currentColor"/>
      <path d="M86 9c-4-5-9-5-12 0 3 5 8 5 12 0zM114 9c4-5 9-5 12 0-3 5-8 5-12 0z"/>
    </g>
  </symbol>
  <symbol id="orn-lotus" viewBox="0 0 160 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 12c-14 16-14 44 0 62 14-18 14-46 0-62z"/>
      <path d="M80 74C58 66 38 48 34 24c24 2 40 18 46 50z"/>
      <path d="M80 74c22-8 42-26 46-50-24 2-40 18-46 50z"/>
      <path d="M80 74C52 74 22 62 8 42c24-4 52 6 72 32z"/>
      <path d="M80 74c28 0 58-12 72-32-24-4-52 6-72 32z"/>
      <path d="M30 88h100"/>
    </g>
  </symbol>
</svg>

<header class="desk-bar">
  <div class="brand">
    <h1><span>Pāṭhaka</span><span class="deva" lang="sa">पाठकः</span></h1>
    <p>Mahābhārata manuscript reader</p>
  </div>
  <nav class="desk-nav" aria-label="Tools">
    <button class="brass" id="btnShelf" type="button">Codex shelf</button>
    <button class="brass" id="btnSettings" type="button">Scribe’s desk</button>
  </nav>
</header>

<main class="book">
  <div class="spread">

    <!-- ===================== LEFT: the folio ===================== -->
    <section class="page page-left" id="pageLeft" aria-label="Manuscript folio">
      <div class="frame">
        <div class="runhead"><span class="title" id="leftTitle">The folio</span><span id="leftMeta"></span></div>

        <div class="plate" id="plate">
          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose manuscript images">
            <svg aria-hidden="true"><use href="#orn-lotus"/></svg>
            <h2>Lay a folio here</h2>
            <p>Drop a photograph or scan, choose files, or paste from the clipboard.</p>
            <span class="quiet">Choose images</span>
          </div>
          <div class="viewport" id="viewport" tabindex="0" aria-label="Folio viewer. Drag to move, scroll or pinch to zoom." hidden>
            <canvas id="cv" width="10" height="10"></canvas>
          </div>
          <div class="viewer-tools" id="viewerTools" hidden>
            <button type="button" id="btnRotL" title="Rotate left" aria-label="Rotate left">⟲</button>
            <button type="button" id="btnRotR" title="Rotate right" aria-label="Rotate right">⟳</button>
            <button type="button" id="btnZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
            <span class="zoom-read" id="zoomRead" aria-live="off">100%</span>
            <button type="button" id="btnZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
            <button type="button" id="btnFit" title="Fit to plate" aria-label="Fit to plate">Fit</button>
          </div>
        </div>

        <details class="adjust" id="adjust" hidden>
          <summary>Adjust the light</summary>
          <div class="adjust-grid">
            <label>Contrast <input type="range" id="adjContrast" min="-50" max="100" step="1" value="20"></label>
            <label>Brightness <input type="range" id="adjBrightness" min="-50" max="50" step="1" value="0"></label>
            <label class="check"><input type="checkbox" id="adjAuto" checked> Stretch the tones</label>
            <label class="check"><input type="checkbox" id="adjGray"> Greyscale</label>
            <label class="check"><input type="checkbox" id="adjOriginal"> Show the original</label>
            <div class="adjust-actions"><button class="quiet small" type="button" id="btnAdjReset">Reset</button></div>
          </div>
        </details>

        <div class="fields">
          <label class="field"><span>Script of the folio</span><select id="selScript"></select></label>

<!-- ==========================================================================
     CORE — everything that does not touch the page: prompts, API calls,
     retries, JSON parsing, image tone adjustment, export text.
     ========================================================================== -->
<script id="core">
(() => {
'use strict';

/* ---------- constants ---------- */
const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta';

const SCRIPTS = [
  { id:'auto',        label:'Detect automatically', lang:'sa' },
  { id:'Devanagari',  label:'Devanāgarī',           lang:'sa' },
  { id:'Grantha',     label:'Grantha',              lang:'sa' },
  { id:'Telugu',      label:'Telugu',               lang:'te' },
  { id:'Kannada',     label:'Kannada',              lang:'kn' },
  { id:'Malayalam',   label:'Malayalam',            lang:'ml' },
  { id:'Tamil',       label:'Tamil',                lang:'ta' },
  { id:'Bengali',     label:'Bengali',              lang:'bn' },
  { id:'Odia',        label:'Odia',                 lang:'or' },
  { id:'Gujarati',    label:'Gujarati',             lang:'gu' },
  { id:'Sharada',     label:'Śāradā',               lang:'sa' },
  { id:'Nandinagari', label:'Nandināgarī',          lang:'sa' },
  { id:'Newa',        label:'Newa (Prachalit)',     lang:'sa' },
  { id:'Tigalari',    label:'Tigalari',             lang:'sa' },
  { id:'Other',       label:'Another script',       lang:'sa' }
];
const TARGET_LANGS = ['English','Hindi','Marathi','Bengali','Tamil','Telugu','Kannada','Malayalam'];
const INDIC_TARGETS = new Set(['Hindi','Marathi','Bengali','Tamil','Telugu','Kannada','Malayalam']);

const DEFAULT_SETTINGS = {
  provider:'gemini',
  geminiKey:'', model:'gemini-flash-latest',
  compatBase:'https://openrouter.ai/api/v1', compatKey:'', compatModel:'',
  targetLang:'English', scriptHint:'auto', remember:true
};

/* ---------- errors ---------- */
class ApiError extends Error {
  constructor(status, message, body, retryAfterMs){
    super(message || ('HTTP ' + status));
    this.name = 'ApiError'; this.status = status; this.body = body || ''; this.retryAfterMs = retryAfterMs || null;
  }
}
class ReadError extends Error {
  constructor(kind, message){ super(message); this.name = 'ReadError'; this.kind = kind; }
}
const abortError = () => { const e = new Error('Aborted'); e.name = 'AbortError'; return e; };

/* ---------- prompts ---------- */
function systemPrompt(targetLang){
  return [
    'You are a palaeographer\u2019s assistant. You read photographs of Mah\u0101bh\u0101rata manuscripts (palm leaf, paper, birch bark) written in many regional Indic scripts.',
    'Your job is faithful transcription, not recall.',
    '',
    'Rules:',
    '1. Transcribe only what is visibly written on this folio, in reading order, one manuscript line per entry. Keep the scribe\u2019s spelling, sandhi, word-joining, punctuation (da\u1e47\u1e0das) and verse or chapter numerals.',
    '2. Never normalise, correct, modernise or complete the text, even if you recognise the passage from the critical edition or the vulgate. Do not fill gaps from memory of the epic.',
    '3. Where a letter is damaged, faded or ambiguous, give your best reading followed by [?]. Where text is lost or unreadable, write [\u2026]. Never invent text to fill a gap.',
    '4. Foliation numbers, string-hole gaps, library stamps, later annotations and marginal additions are not part of the text: describe them in "notes", not in "lines".',
    '5. For every line give: "text" (exactly as written, in the manuscript\u2019s own script, Unicode), "devanagari" (the same line in Devanagari; identical to "text" if the script is already Devanagari), "iast" (IAST romanisation of the same line), and "confidence" ("high", "medium" or "low").',
    '6. "translation" is a faithful, readable translation of what you transcribed into ' + targetLang + '. Keep [?] and [\u2026] marks where they affect meaning. Separate verses or sentences with a line break.',
    '7. "identification": if you can tell which parva or adhy\u0101ya the passage is from, say so and say how sure you are. If you cannot, write "Unidentified".',
    '8. If the image is not a manuscript or nothing can be read, set "legible" to false, leave "lines" empty and explain in "notes".',
    '',
    'Reply with ONE JSON object and nothing else (no markdown fences, no commentary), shaped exactly like this:',
    '{"legible":true,"script":"name of the script","language":"e.g. Sanskrit","layout":"short description of the folio layout","identification":"...",',
    ' "lines":[{"text":"...","devanagari":"...","iast":"...","confidence":"high"}],',
    ' "translation":"...","notes":["..."]}'
  ].join('\n');
}

function userPrompt({ scriptHint, context, targetLang }){
  const bits = ['Read this folio.'];
  if (scriptHint && scriptHint !== 'auto') bits.push('The script is ' + scriptHint + '.');
  else bits.push('Identify the script yourself.');
  if (context && context.trim()) bits.push('The reader says: ' + context.trim().slice(0, 200));
  bits.push('Translate into ' + (targetLang || 'English') + '. Return only the JSON object.');
  return bits.join(' ');
}

/* ---------- reply parsing ---------- */
function extractJson(text){
  if (typeof text !== 'string' || !text.trim()) throw new ReadError('empty', 'The model sent back an empty reply.');
  let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  try { return JSON.parse(t); } catch (_) { /* fall through */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (_) { /* fall through */ } }
  throw new ReadError('parse', 'The reply was not valid JSON.');
}

const str = v => v == null ? '' : (Array.isArray(v) ? v.map(str).join('\n') : String(v)).trim();
const DOUBT = /\[\?\]|\[\s*(?:\u2026|\.\.\.)\s*\]/;

function normConfidence(c, text){
  let v = String(c || '').toLowerCase();
  if (v !== 'high' && v !== 'medium' && v !== 'low') v = 'medium';
  if (v === 'high' && DOUBT.test(text)) v = 'medium';
  return v;
}

function normalizeResult(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new ReadError('parse', 'The reply did not have the expected shape.');
  let raw = Array.isArray(obj.lines) ? obj.lines : [];
  if (!raw.length && typeof obj.transcription === 'string') raw = obj.transcription.split(/\r?\n/);
  const lines = raw
    .map(l => (typeof l === 'string') ? { text: l } : (l || {}))
    .map(l => {
      const text = str(l.text ?? l.written ?? l.original);
      return {
        text,
        devanagari: str(l.devanagari ?? l.deva),
        iast: str(l.iast ?? l.roman ?? l.transliteration),
        confidence: normConfidence(l.confidence, text)
      };
    })
    .filter(l => l.text || l.devanagari || l.iast);
  let notes = obj.notes;
  if (typeof notes === 'string') notes = notes.trim() ? [notes] : [];
  if (!Array.isArray(notes)) notes = [];
  notes = notes.map(str).filter(Boolean);
  return {
    legible: obj.legible !== false,
    script: str(obj.script) || 'Unknown',
    language: str(obj.language) || 'Unknown',
    layout: str(obj.layout),
    identification: str(obj.identification) || 'Unidentified',
    lines,
    translation: str(obj.translation),
    notes
  };
}

/* ---------- HTTP ---------- */
function parseRetryDelay(bodyText, headers){
  let m = /retryDelay"?\s*:\s*"?(\d+(?:\.\d+)?)s/i.exec(bodyText || '') || /retry in (\d+(?:\.\d+)?)s/i.exec(bodyText || '');
  if (m) return Math.round(parseFloat(m[1]) * 1000);
  const h = headers && headers.get && headers.get('retry-after');
  if (h && /^\d+$/.test(h)) return parseInt(h, 10) * 1000;
  return null;
}

async function httpJson(url, init){
  const resp = await fetch(url, init);
  if (!resp.ok) {
    const bodyText = await resp.text().catch(() => '');
    let msg = bodyText;
    try { const j = JSON.parse(bodyText); msg = (j.error && (j.error.message || j.error)) || j.message || bodyText; } catch (_) {}
    throw new ApiError(resp.status, String(msg).slice(0, 600), bodyText, parseRetryDelay(bodyText, resp.headers));
  }
  return resp.json();
}

let sleepImpl = (ms, signal) => new Promise((resolve, reject) => {
  if (signal && signal.aborted) return reject(abortError());
  const t = setTimeout(() => { if (signal) signal.removeEventListener('abort', onAbort); resolve(); }, ms);
  const onAbort = () => { clearTimeout(t); reject(abortError()); };
  if (signal) signal.addEventListener('abort', onAbort, { once: true });
});

async function withRetry(fn, { signal, onStatus, max = 3 } = {}){
  for (let attempt = 0; ; attempt++) {
    try { return await fn(); }
    catch (e) {
      if (signal && signal.aborted) throw abortError();
      const retriable = e instanceof ApiError && [429, 500, 502, 503, 504].includes(e.status);
      if (!retriable || attempt >= max) throw e;
      let wait = e.retryAfterMs != null ? e.retryAfterMs : Math.min(2000 * 2 ** attempt, 15000);
      if (e.status === 429 && wait > 45000) throw e;      // daily quota: waiting is pointless
      wait = Math.min(Math.max(wait, 1000), 45000);
      for (let s = Math.ceil(wait / 1000); s > 0; s--) {
        if (onStatus) onStatus((e.status === 429 ? 'Rate limit reached' : 'The service is busy') + '. Trying again in ' + s + 's\u2026');
        await sleepImpl(1000, signal);
      }
    }
  }
}

/* ---------- providers ---------- */
function splitDataUrl(dataUrl){
  const m = /^data:([^;,]+);base64,(.*)$/s.exec(dataUrl || '');
  if (!m) throw new ReadError('image', 'The image could not be prepared for sending.');
  return { mime: m[1], data: m[2] };
}

async function callGemini({ apiKey, model, system, userText, imageDataUrl, json, signal }){
  const name = String(model).replace(/^models\//, '');
  const url = GEMINI_BASE + '/models/' + encodeURIComponent(name) + ':generateContent?key=' + encodeURIComponent(apiKey);
  const parts = [];
  if (imageDataUrl) { const { mime, data } = splitDataUrl(imageDataUrl); parts.push({ inlineData: { mimeType: mime, data } }); }
  parts.push({ text: userText });
  const generationConfig = { temperature: 0.1, maxOutputTokens: 16384 };
  if (json) generationConfig.responseMimeType = 'application/json';
  const body = { contents: [{ role: 'user', parts }], generationConfig };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const data = await httpJson(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });

  if (data.promptFeedback && data.promptFeedback.blockReason)
    throw new ReadError('blocked', 'The request was blocked (' + data.promptFeedback.blockReason + ').');
  const cand = data.candidates && data.candidates[0];
  if (!cand) throw new ReadError('empty', 'The model returned no answer.');
  const text = ((cand.content && cand.content.parts) || [])
    .filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  if (!text && cand.finishReason && cand.finishReason !== 'STOP' && cand.finishReason !== 'MAX_TOKENS')
    throw new ReadError('blocked', 'The model stopped early (' + cand.finishReason + ').');
  return { text, finishReason: cand.finishReason || '' };
}

async function callCompat({ base, apiKey, model, system, userText, imageDataUrl, signal }){
  const url = String(base).replace(/\/+$/, '') + '/chat/completions';
  const content = [{ type: 'text', text: userText }];
  if (imageDataUrl) content.push({ type: 'image_url', image_url: { url: imageDataUrl } });
  const messages = [];
  if (system) messages.push({ role: 'system', content: system });
  messages.push({ role: 'user', content });
  const data = await httpJson(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({ model, messages, temperature: 0.1, max_tokens: 8000 }),
    signal
  });
  if (data.error) throw new ApiError(data.error.code || 502, data.error.message || 'Provider error');
  const choice = data.choices && data.choices[0];
  if (!choice || !choice.message) throw new ReadError('empty', 'The model returned no answer.');
  let text = choice.message.content;
  if (Array.isArray(text)) text = text.map(p => p && p.text ? p.text : '').join('');
  return { text: text || '', finishReason: choice.finish_reason || '' };
}

function assertConfigured(s){
  if (s.provider === 'compat') {
    if (!s.compatKey) throw new ReadError('config', 'Add an API key at the scribe\u2019s desk first.');
    if (!s.compatBase) throw new ReadError('config', 'Add the provider\u2019s base URL at the scribe\u2019s desk.');
    if (!s.compatModel) throw new ReadError('config', 'Choose a vision model at the scribe\u2019s desk.');
  } else {
    if (!s.geminiKey) throw new ReadError('config', 'Add a Gemini API key at the scribe\u2019s desk first.');
    if (!s.model) throw new ReadError('config', 'Choose a model at the scribe\u2019s desk.');
  }
}

async function readFolio({ imageDataUrl, settings, scriptHint, context, signal, onStatus }){
  assertConfigured(settings);
  const targetLang = settings.targetLang || 'English';
  const system = systemPrompt(targetLang);
  const userText = userPrompt({ scriptHint, context, targetLang });
  const model = settings.provider === 'compat' ? settings.compatModel : settings.model;

  if (onStatus) onStatus('Sending the folio to ' + model + '\u2026');
  const out = await withRetry(() => settings.provider === 'compat'
      ? callCompat({ base: settings.compatBase, apiKey: settings.compatKey, model, system, userText, imageDataUrl, signal })
      : callGemini({ apiKey: settings.geminiKey, model, system, userText, imageDataUrl, json: true, signal }),
    { signal, onStatus });

  if (onStatus) onStatus('Setting the lines in order\u2026');
  let obj;
  try { obj = extractJson(out.text); }
  catch (e) {
    if (out.finishReason === 'MAX_TOKENS' || out.finishReason === 'length')
      throw new ReadError('truncated', 'The reading was cut off because the folio holds a lot of text.');
    throw e;
  }
  const result = normalizeResult(obj);
  result.meta = { provider: settings.provider, model, targetLang, readAt: new Date().toISOString() };
  return result;
}

async function testConnection(settings, signal){
  assertConfigured(settings);
  const userText = 'Reply with the single word: ready';
  const out = settings.provider === 'compat'
    ? await callCompat({ base: settings.compatBase, apiKey: settings.compatKey, model: settings.compatModel, userText, signal })
    : await callGemini({ apiKey: settings.geminiKey, model: settings.model, userText, json: false, signal });
  return out.text.trim().slice(0, 80) || '(no text)';
}

async function listGeminiModels(apiKey, signal){
  if (!apiKey) throw new ReadError('config', 'Paste your Gemini key first.');
  const data = await httpJson(GEMINI_BASE + '/models?pageSize=200&key=' + encodeURIComponent(apiKey), { signal });
  return (data.models || [])
    .filter(m => /^models\/gemini/.test(m.name) && (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .sort();
}

/* ---------- friendly errors ---------- */
function describeError(e){
  const detail = (e && e.message) ? String(e.message).slice(0, 400) : '';
  if (e instanceof ApiError) {
    const s = e.status;
    if ((s === 400 || s === 401 || s === 403) && /api key|api_key|credential|unauthori[sz]ed|permission/i.test(e.message))
      return { title: 'The API key was not accepted', hint: 'Open the scribe\u2019s desk and paste a fresh key, then test the connection.', detail };
    if (s === 400) return { title: 'The service rejected the request', hint: 'The model may not accept images. Pick another model at the scribe\u2019s desk.', detail };
    if (s === 401 || s === 403) return { title: 'Access was refused', hint: 'Check the key, and that this service is available in your region.', detail };
    if (s === 404) return { title: 'That model was not found', hint: 'Use Find models at the scribe\u2019s desk to pick one your key can use.', detail };
    if (s === 413) return { title: 'The image is too large', hint: 'Crop the photograph or use a smaller scan.', detail };
    if (s === 429) return { title: 'The free-tier limit has been reached', hint: 'Wait a minute and try again. If the daily allowance is spent, try a lighter model or come back tomorrow.', detail };
    if (s >= 500) return { title: 'The model service is busy', hint: 'Nothing is wrong with your folio. Try again in a moment.', detail };
    return { title: 'The service returned an error (' + s + ')', hint: 'Try again, or choose another model.', detail };
  }
  if (e instanceof ReadError) {
    const map = {
      config:    ['Setup is not finished', 'Open the scribe\u2019s desk and complete the details.'],
      blocked:   ['The model declined to read this folio', 'Try again. Some passages trip safety or recitation filters; a tighter crop can help.'],
      empty:     ['The model sent nothing back', 'Try again, or choose a different model.'],
      parse:     ['The reply could not be understood', 'Try again. Smaller models sometimes break the format; a larger Flash model is steadier.'],
      truncated: ['The reading was cut off', 'Crop the photograph to half a folio, or read it in two parts.'],
      image:     ['The image could not be prepared', 'Try another file.']
    };
    const m = map[e.kind] || ['Something went wrong', 'Try again.'];
    return { title: m[0], hint: m[1], detail };
  }
  if (e instanceof TypeError)
    return { title: 'The service could not be reached', hint: 'Check your connection and any ad or privacy blocker, then try again.', detail };
  return { title: 'Something went wrong', hint: 'Try again.', detail };
}

/* ---------- image tone adjustment (works on RGBA bytes) ---------- */
function isNeutral(adj){ return !adj.auto && !adj.gray && !(adj.contrast) && !(adj.brightness); }

function applyAdjustments(data, adj){
  const n = data.length;
  let lo = 0, hi = 255;
  if (adj.auto) {
    const hist = new Uint32Array(256); let total = 0;
    for (let i = 0; i < n; i += 4) { hist[((data[i] * 299 + data[i + 1] * 587 + data[i + 2] * 114) / 1000) | 0]++; total++; }
    const cut = total * 0.01; let acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > cut) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > cut) { hi = v; break; } }
    if (hi - lo < 32) { lo = 0; hi = 255; }
  }
  const scale = 255 / (hi - lo);
  const c = Math.max(-100, Math.min(100, adj.contrast || 0)) * 2.55;
  const cf = (259 * (c + 255)) / (255 * (259 - c));
  const b = (adj.brightness || 0) * 1.275;
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) lut[v] = cf * ((v - lo) * scale - 128) + 128 + b;
  for (let i = 0; i < n; i += 4) {
    if (adj.gray) {
      const g = lut[((data[i] * 299 + data[i + 1] * 587 + data[i + 2] * 114) / 1000) | 0];
      data[i] = data[i + 1] = data[i + 2] = g;
    } else { data[i] = lut[data[i]]; data[i + 1] = lut[data[i + 1]]; data[i + 2] = lut[data[i + 2]]; }
  }
}

/* ---------- export text ---------- */
function linesText(result, field){ return result.lines.map(l => l[field] || '').join('\n'); }

function tabText(folio, tab){
  const r = folio.result; if (!r) return '';
  if (tab === 'written') return linesText(r, 'text');
  if (tab === 'devanagari') return linesText(r, 'devanagari');
  if (tab === 'iast') return linesText(r, 'iast');
  if (tab === 'translation') return r.translation;
  return r.notes.join('\n');
}

function toText(folio){
  const r = folio.result; if (!r) return '';
  const out = [];
  out.push('Folio: ' + folio.name);
  out.push('Script: ' + r.script + '   Language: ' + r.language);
  if (r.layout) out.push('Layout: ' + r.layout);
  out.push('Passage: ' + r.identification);
  if (r.meta) out.push('Read with: ' + r.meta.model + ' on ' + r.meta.readAt.slice(0, 10));
  out.push('');
  const section = (title, body) => { out.push('\u2014 ' + title + ' \u2014', body || '(none)', ''); };
  section('As written', r.lines.map((l, i) => (i + 1) + '. ' + l.text).join('\n'));
  section('Devanagari', r.lines.map((l, i) => (i + 1) + '. ' + l.devanagari).join('\n'));
  section('IAST', r.lines.map((l, i) => (i + 1) + '. ' + l.iast).join('\n'));
  section('Translation (' + ((r.meta && r.meta.targetLang) || 'English') + ')', r.translation);
  section('Marginalia and notes', r.notes.map(n => '* ' + n).join('\n'));
  out.push('Machine reading. Check against the folio before citing.');
  return out.join('\n');
}

globalThis.Core = {

<script id="ui">
(() => {
'use strict';
const Core = globalThis.Core;

/* ---------- tiny helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const MAX_SIDE = 2600;           // longest side sent to the model
const SHELF_KEY = 'pathaka.shelf';
const SETTINGS_KEY = 'pathaka.settings';

/* ---------- state ---------- */
const state = {
  folios: [], activeId: null, tab: 'written',
  busy: false, abort: null, status: '',
  settings: loadSettings(), shelf: loadShelf()
};
const activeFolio = () => state.folios.find(f => f.id === state.activeId) || null;
const DEFAULT_ADJ = () => ({ auto: true, gray: false, contrast: 20, brightness: 0 });

/* ---------- persistence ---------- */
function loadSettings(){
  let raw = null;
  try { raw = localStorage.getItem(SETTINGS_KEY) || sessionStorage.getItem(SETTINGS_KEY); } catch (_) {}
  let saved = {};
  try { saved = raw ? JSON.parse(raw) : {}; } catch (_) {}
  return Object.assign({}, Core.DEFAULT_SETTINGS, saved);
}
function saveSettings(){
  const json = JSON.stringify(state.settings);
  try {
    if (state.settings.remember) { localStorage.setItem(SETTINGS_KEY, json); sessionStorage.removeItem(SETTINGS_KEY); }
    else { sessionStorage.setItem(SETTINGS_KEY, json); localStorage.removeItem(SETTINGS_KEY); }
  } catch (_) { toast('This browser would not store the settings.'); }
}
function loadShelf(){
  try { const v = JSON.parse(localStorage.getItem(SHELF_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch (_) { return []; }
}
function saveShelf(){
  while (state.shelf.length > 40) state.shelf.pop();
  for (;;) {
    try { localStorage.setItem(SHELF_KEY, JSON.stringify(state.shelf)); return; }
    catch (_) { if (state.shelf.length <= 1) return; state.shelf.pop(); }
  }
}
let shelfTimer = null;
function shelfSoon(folio){
  clearTimeout(shelfTimer);
  shelfTimer = setTimeout(() => putOnShelf(folio), 500);
}
function putOnShelf(folio){
  if (!folio || !folio.result) return;
  const entry = { id: folio.id, name: folio.name, savedAt: new Date().toISOString(), thumb: folio.thumb || '', result: folio.result };
  state.shelf = [entry, ...state.shelf.filter(e => e.id !== folio.id)];
  saveShelf();
}

/* ---------- toast + live region ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ==========================================================================
   Folios and the viewer
   ========================================================================== */
const cv = $('#cv'), viewport = $('#viewport');
const V = { z: 1, x: 0, y: 0 };
const MIN_Z = 0.05, MAX_Z = 10;

function applyView(){
  cv.style.transform = 'translate(' + V.x + 'px,' + V.y + 'px) scale(' + V.z + ')';
  $('#zoomRead').textContent = Math.round(V.z * 100) + '%';
}
function fitView(){
  const r = viewport.getBoundingClientRect();
  if (!r.width || !cv.width) return;
  V.z = Math.min(r.width / cv.width, r.height / cv.height) * 0.97;
  V.x = (r.width - cv.width * V.z) / 2; V.y = (r.height - cv.height * V.z) / 2;
  applyView();
}
function zoomAt(cx, cy, factor){
  const r = viewport.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const nz = clamp(V.z * factor, MIN_Z, MAX_Z);
  V.x = px - (px - V.x) * (nz / V.z); V.y = py - (py - V.y) * (nz / V.z); V.z = nz;
  applyView();
}
function zoomCentre(f){ const r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); }

(function wireViewer(){
  const pointers = new Map(); let lastDist = 0;
  const dist = () => { const p = [...pointers.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
  const mid = () => { const p = [...pointers.values()]; return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; };
  viewport.addEventListener('pointerdown', e => {
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastDist = pointers.size === 2 ? dist() : 0;
  });
  viewport.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1) { V.x += cur.x - prev.x; V.y += cur.y - prev.y; applyView(); }
    else if (pointers.size === 2) { const d = dist(); if (lastDist) { const m = mid(); zoomAt(m.x, m.y, d / lastDist); } lastDist = d; }
  });
  const up = e => { pointers.delete(e.pointerId); lastDist = 0; };
  viewport.addEventListener('pointerup', up); viewport.addEventListener('pointercancel', up);
  viewport.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  viewport.addEventListener('dblclick', fitView);
  viewport.addEventListener('keydown', e => {
    const step = 40;
    if (e.key === '+' || e.key === '=') zoomCentre(1.2);
    else if (e.key === '-') zoomCentre(1 / 1.2);
    else if (e.key === '0') fitView();
    else if (e.key === 'ArrowLeft') { V.x += step; applyView(); }
    else if (e.key === 'ArrowRight') { V.x -= step; applyView(); }
    else if (e.key === 'ArrowUp') { V.y += step; applyView(); }
    else if (e.key === 'ArrowDown') { V.y -= step; applyView(); }
    else return;
    e.preventDefault();
  });
})();

/* build the rotated, size-limited base canvas for a folio */
function buildBase(folio){
  if (folio.base) return folio.base;
  const img = folio.img;
  const w = img.naturalWidth || img.width, h2 = img.naturalHeight || img.height;
  const rot = ((folio.rotation % 360) + 360) % 360;
  const swap = rot === 90 || rot === 270;
  const k = Math.min(1, MAX_SIDE / Math.max(w, h2));
  const sw = Math.max(1, Math.round(w * k)), sh = Math.max(1, Math.round(h2 * k));
  const c = document.createElement('canvas');
  c.width = swap ? sh : sw; c.height = swap ? sw : sh;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.translate(c.width / 2, c.height / 2); ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(img, -sw / 2, -sh / 2, sw, sh);
  folio.base = c;
  return c;
}

/* processed copy of the base (what the model receives) */
function processedCanvas(folio){
  const base = buildBase(folio);
  const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
  const ctx = c.getContext('2d'); ctx.drawImage(base, 0, 0);
  if (!Core.isNeutral(folio.adj)) {
    const id = ctx.getImageData(0, 0, c.width, c.height);
    Core.applyAdjustments(id.data, folio.adj);
    ctx.putImageData(id, 0, 0);
  }
  return c;
}

let paintQueued = false;
function paint(refit){
  if (paintQueued && !refit) return;
  paintQueued = true;
  requestAnimationFrame(() => {
    paintQueued = false;
    const f = activeFolio(); if (!f || !f.img) return;
    const base = buildBase(f);
    const sizeChanged = cv.width !== base.width || cv.height !== base.height;
    if (sizeChanged) { cv.width = base.width; cv.height = base.height; }
    const ctx = cv.getContext('2d');
    if (f.showOriginal || f.restored || Core.isNeutral(f.adj)) { ctx.drawImage(base, 0, 0); }
    else {
      ctx.drawImage(base, 0, 0);
      const id = ctx.getImageData(0, 0, cv.width, cv.height);
      Core.applyAdjustments(id.data, f.adj);
      ctx.putImageData(id, 0, 0);
    }
    if (refit || sizeChanged) fitView();
  });
}

function makeThumb(folio){
  const base = buildBase(folio);
  const k = 160 / Math.max(base.width, base.height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(base.width * k)); c.height = Math.max(1, Math.round(base.height * k));
  c.getContext('2d').drawImage(base, 0, 0, c.width, c.height);
  try { return c.toDataURL('image/jpeg', 0.6); } catch (_) { return ''; }
}

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('decode'));
    img.src = src;
  });
}

async function addFiles(fileList){
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('Choose image files such as JPG, PNG or WebP.'); return; }
  let first = null, failed = 0;
  for (const file of files) {
    try {
      const url = URL.createObjectURL(file);
      let img;
      try { img = await loadImage(url); } catch (e) { URL.revokeObjectURL(url); throw e; }
      const folio = {
        id: uid(), name: file.name && file.name !== 'image.png' ? file.name : 'Pasted folio ' + (state.folios.length + 1),
        url, img, rotation: 0, base: null, adj: DEFAULT_ADJ(), showOriginal: false,
        status: 'idle', result: null, error: null, thumb: '', restored: false
      };
      folio.thumb = makeThumb(folio);
      state.folios.push(folio);
      if (!first) first = folio;
    } catch (_) { failed++; }
  }
  if (failed) toast(failed + (failed === 1 ? ' file' : ' files') + ' could not be opened as an image.');
  if (first) setActive(first.id);

}

function removeFolio(id){
  const i = state.folios.findIndex(f => f.id === id); if (i < 0) return;
  const f = state.folios[i];
  if (f.status === 'reading' && state.abort) state.abort.abort();
  if (f.url) URL.revokeObjectURL(f.url);
  state.folios.splice(i, 1);
  if (state.activeId === id) {
    const next = state.folios[Math.min(i, state.folios.length - 1)];
    state.activeId = next ? next.id : null;
    if (next) { syncAdjustUi(); paint(true); }
  }
  render();
}

function setActive(id){
  state.activeId = id;
  const f = activeFolio();
  if (f && f.status === 'done' && state.tab === 'translation' && !f.result.translation) state.tab = 'written';
  syncAdjustUi();
  render();
  paint(true);
}

/* ==========================================================================
   Reading
   ========================================================================== */
function needsKey(){
  const s = state.settings;
  return s.provider === 'compat' ? !(s.compatKey && s.compatModel && s.compatBase) : !(s.geminiKey && s.model);
}

async function readOne(folio){
  folio.status = 'reading'; folio.error = null; state.status = 'Preparing the folio\u2026';
  state.activeId = folio.id; syncAdjustUi(); render(); paint(true);
  state.abort = new AbortController();

    const dataUrl = processedCanvas(folio).toDataURL('image/jpeg', 0.92);
    const result = await Core.readFolio({
      imageDataUrl: dataUrl, settings: state.settings,
      scriptHint: $('#selScript').value, context: $('#inpContext').value, signal,
      onStatus: msg => { state.status = msg; $('#liveStatus').textContent = msg; if (folio.id === state.activeId) updateReadingText(); }
    });

    folio.status = 'error'; folio.error = Core.describeError(e); folio.errorFatal = isFatal(e);

}
const isFatal = e => (e instanceof Core.ApiError && [400, 401, 403, 404, 429].includes(e.status)) || (e instanceof Core.ReadError && e.kind === 'config');

async function runReading(list){
  if (state.busy) return;
  if (needsKey()) { openSettings('Add a key and model to begin reading.'); return; }
  state.busy = true; render();

    const f = list[i];
    if (!state.folios.includes(f) || f.restored) continue;
    const ok = await readOne(f);
    if (ok) done++;
    render();
    if (!ok && (f.status === 'idle' || f.errorFatal)) break;           // stopped, or the next one would fail the same way

  }
  state.busy = false; state.status = '';

}

/* ==========================================================================
   Rendering
   ========================================================================== */
const TAB_LABELS = { written: 'As written', devanagari: 'Devanāgarī', iast: 'Roman', translation: 'English', notes: 'Marginalia' };

function render(){
  renderLeft(); renderRight();
}

function renderLeft(){
  const f = activeFolio();

  $('#adjust').hidden = !has;
  $('#strip').hidden = !has;

        'aria-label': 'Open ' + fo.name, onclick: () => setActive(fo.id) },
        h('img', { src: fo.thumb || '', alt: '' })),
      h('span', { class: 'dot ' + (fo.status === 'reading' ? 'reading' : fo.status === 'done' ? 'done' : fo.status === 'error' ? 'error' : ''), title: fo.status }),
      h('button', { type: 'button', class: 'rm', 'aria-label': 'Remove ' + fo.name, onclick: ev => { ev.stopPropagation(); removeFolio(fo.id); } }, '×')));
  }
  strip.append(h('button', { type: 'button', class: 'thumb add', 'aria-label': 'Add more folios', onclick: () => $('#fileInput').click() }, '+'));

  const busy = state.busy;
  $('#btnRead').hidden = busy; $('#btnReadAll').hidden = busy || state.folios.length < 2;
  $('#btnStop').hidden = !busy;
  $('#btnRead').disabled = !f || f.restored;
  $('#btnReadAll').disabled = !state.folios.some(x => !x.restored);
  $('#readHint').textContent = !f ? '' : f.restored ? 'Only a small preview was kept, so this folio cannot be read again. Add the image to read it afresh.'
    : busy ? state.status : '';
}

function syncAdjustUi(){
  const f = activeFolio(); if (!f) return;
  $('#adjContrast').value = f.adj.contrast; $('#adjBrightness').value = f.adj.brightness;
  $('#adjAuto').checked = f.adj.auto; $('#adjGray').checked = f.adj.gray; $('#adjOriginal').checked = !!f.showOriginal;
  const off = f.restored;
  for (const id of ['adjContrast', 'adjBrightness', 'adjAuto', 'adjGray', 'adjOriginal', 'btnAdjReset', 'btnRotL', 'btnRotR']) $('#' + id).disabled = off;
}

function updateRibbons(f){
  const done = !!f && f.status === 'done';

    b.disabled = !done;

function renderRight(){

}

function invocation(f){
  const cta = needsKey()
    ? h('p', { class: 'cta' }, h('button', { class: 'seal', type: 'button', onclick: () => openSettings('') }, 'Open the scribe’s desk'))
    : null;
  return h('div', { class: 'invocation' },
    h('p', { class: 'rubric', lang: 'sa' }, 'नारायणं नमस्कृत्य नरं चैव नरोत्तमम् ।', h('br'), 'देवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥'),
    h('p', { class: 'roman', lang: 'sa-Latn' }, 'nārāyaṇaṃ namaskṛtya naraṃ caiva narottamam |', h('br'), 'devīṃ sarasvatīṃ caiva tato jayam udīrayet ||'),
    h('p', { class: 'gloss' }, 'Having bowed to Nārāyaṇa, and to Nara, best of men, and to the goddess Sarasvatī, one should then recite the Jaya.'),
    (() => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ornament'); s.setAttribute('aria-hidden', 'true');
             const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#orn-divider'); s.append(u); return s; })(),
    h('ol', null,
      h('li', null, f ? 'Check the tones under “Adjust the light”, then press Read this folio.' : 'Lay a photograph of a folio on the left page.'),
      h('li', null, 'Name the script if you know it. The model otherwise has to guess.'),
      h('li', null, 'Correct any line by clicking it. Doubtful readings are underlined in red.')),
    cta);
}

function readingView(){
  return h('div', { class: 'reading-view' },
    h('h3', null, 'The scribe is reading'),
    h('p', { id: 'readingText' }, state.status || 'Working…'),
    h('div', { class: 'ink-line' }), h('div', { class: 'ink-line' }), h('div', { class: 'ink-line' }), h('div', { class: 'ink-line' }));
}
function updateReadingText(){ const el = $('#readingText'); if (el) el.textContent = state.status; renderLeftHint(); }
function renderLeftHint(){ if (state.busy) $('#readHint').textContent = state.status; }

function errorView(f){
  const e = f.error || { title: 'Something went wrong', hint: '', detail: '' };
  return h('div', { class: 'error-view' },
    h('h3', null, e.title), h('p', null, e.hint),
    e.detail ? h('p', { class: 'detail' }, e.detail) : null,
    h('p', null,
      h('button', { class: 'quiet small', type: 'button', onclick: () => runReading([f]) }, 'Try again'), ' ',
      /key|desk|model|Setup/i.test(e.title + e.hint) ? h('button', { class: 'quiet small', type: 'button', onclick: () => openSettings('') }, 'Open the scribe’s desk') : null));
}

function scriptLang(result){
  const s = Core.SCRIPTS.find(x => x.id.toLowerCase() === String(result.script).toLowerCase() || x.label.toLowerCase() === String(result.script).toLowerCase());
  return s ? s.lang : 'sa';
}

function tabView(f){
  const r = f.result, tab = state.tab;
  if (tab === 'translation') {
    const indic = Core.INDIC_TARGETS.has((r.meta && r.meta.targetLang) || 'English');
    return h('div', null,
      h('div', { class: 'translation' + (indic ? ' indic' : ''), contenteditable: 'true', spellcheck: 'false', 'data-field': 'translation', 'aria-label': 'Translation, editable' },
        r.translation || 'No translation was returned.'),
      h('p', { class: 'legend' }, 'Click the text to correct it. Marks such as [?] show where the reading was doubtful.'));
  }
  if (tab === 'notes') return notesView(r);

  const field = tab === 'written' ? 'text' : tab;

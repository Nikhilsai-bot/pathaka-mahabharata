  if (!r.lines.length) return h('p', { class: 'legend' }, r.legible ? 'No lines were returned for this folio.' : 'The model could not make out any text. See the marginalia.');
  const ol = h('ol', { class: 'lines ' + cls + (f.justRead ? ' writing' : '') });
  r.lines.forEach((ln, i) => {
    const li = h('li', { class: 'conf-' + ln.confidence, style: f.justRead ? '--d:' + Math.min(i * 0.07, 1.6).toFixed(2) + 's' : null, title: ln.confidence === 'low' ? 'Doubtful reading' : ln.confidence === 'medium' ? 'Some letters uncertain' : null },
      h('span', { class: 'ln', 'aria-hidden': 'true' }, String(i + 1)),
      h('span', { class: 'tx' + (ln[field] ? '' : ' empty'), contenteditable: 'true', spellcheck: 'false', lang, 'data-i': i, 'data-field': field, 'aria-label': 'Line ' + (i + 1) }, ln[field] || '—'));
    ol.append(li);
  });
  f.justRead = false;
  return h('div', null, ol,
    h('p', { class: 'legend' }, 'Lines with a red underline were read with less certainty. Click any line to correct it.'));
}

function notesView(r){
  const row = (k, v) => v ? [h('dt', null, k), h('dd', null, v)] : [];
  const facts = h('dl', { class: 'facts' },
    row('Script', r.script), row('Language', r.language), row('Layout', r.layout), row('Passage', r.identification),
    r.meta ? row('Read with', r.meta.model + ', ' + r.meta.readAt.slice(0, 10)) : []);
  return h('div', { class: 'notes' }, facts,
    h('h3', null, 'Marginalia and remarks'),

(function wireEditing(){

  sheet.addEventListener('input', e => {
    const t = e.target; const f = activeFolio();
    if (!f || !f.result || !t.dataset || !t.dataset.field) return;

function download(name, mime, text){
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const baseName = f => f.name.replace(/\.[^.]+$/, '').replace(/[^\w\-\u0900-\u0dff]+/g, '_') || 'folio';

function wireControls(){
  /* file intake */

  dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) addFiles(fileInput.files); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => pageLeft.addEventListener(ev, e => { e.preventDefault(); pageLeft.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(ev => pageLeft.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === pageLeft) pageLeft.classList.remove('dragging'); }));
  pageLeft.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', e => {
    const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  /* viewer buttons */
  $('#btnZoomIn').addEventListener('click', () => zoomCentre(1.25));
  $('#btnZoomOut').addEventListener('click', () => zoomCentre(1 / 1.25));
  $('#btnFit').addEventListener('click', fitView);
  const rotate = d => { const f = activeFolio(); if (!f || f.restored) return; f.rotation = (f.rotation + d + 360) % 360; f.base = null; paint(true); renderLeft(); };
  $('#btnRotL').addEventListener('click', () => rotate(-90));
  $('#btnRotR').addEventListener('click', () => rotate(90));

  /* tone adjustments */
  const adj = () => { const f = activeFolio(); if (!f) return; f.adj.contrast = +$('#adjContrast').value; f.adj.brightness = +$('#adjBrightness').value;
    f.adj.auto = $('#adjAuto').checked; f.adj.gray = $('#adjGray').checked; f.showOriginal = $('#adjOriginal').checked; paint(false); };
  for (const id of ['adjContrast', 'adjBrightness', 'adjAuto', 'adjGray', 'adjOriginal']) $('#' + id).addEventListener('input', adj);
  $('#btnAdjReset').addEventListener('click', () => { const f = activeFolio(); if (!f) return; f.adj = DEFAULT_ADJ(); f.showOriginal = false; syncAdjustUi(); paint(false); });

  /* script + context */
  const sel = $('#selScript');
  for (const s of Core.SCRIPTS) sel.append(h('option', { value: s.id }, s.label));
  sel.value = state.settings.scriptHint || 'auto';
  sel.addEventListener('change', () => { state.settings.scriptHint = sel.value; saveSettings(); });

  /* reading */
  $('#btnRead').addEventListener('click', () => { const f = activeFolio(); if (f) runReading([f]); });
  $('#btnReadAll').addEventListener('click', () => runReading(state.folios.filter(f => !f.restored)));
  $('#btnStop').addEventListener('click', () => { if (state.abort) state.abort.abort(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !state.busy) { const f = activeFolio(); if (f && !f.restored) { e.preventDefault(); runReading([f]); } }
  });

  /* ribbons */
  $('#ribbons').addEventListener('click', e => {
    const b = e.target.closest('.ribbon'); if (!b || b.disabled) return;
    state.tab = b.dataset.tab; renderRight();
  });
  $('#ribbons').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('.ribbon:not(:disabled)')]; if (!tabs.length) return;
    const i = tabs.findIndex(t => t.dataset.tab === state.tab);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    state.tab = n.dataset.tab; renderRight(); const nb = document.querySelector('.ribbon[data-tab="' + state.tab + '"]'); if (nb) nb.focus();
  });

  /* page actions */
  $('#btnCopy').addEventListener('click', async () => {
    const f = activeFolio(); if (!f || !f.result) return;
    const text = Core.tabText(f, state.tab);

/* ---------- settings dialog ---------- */
function openSettings(message){
  const s = state.settings, dlg = $('#dlgSettings');
  document.querySelector('input[name=provider][value=' + (s.provider === 'compat' ? 'compat' : 'gemini') + ']').checked = true;
  $('#setGeminiKey').value = s.geminiKey; $('#setGeminiModel').value = s.model;
  $('#setCompatBase').value = s.compatBase; $('#setCompatKey').value = s.compatKey; $('#setCompatModel').value = s.compatModel;
  $('#setLang').value = s.targetLang; $('#setRemember').checked = !!s.remember;
  $('#setGeminiKey').type = 'password'; $('#btnShowKey').textContent = 'Show';
  setProviderUi(); setStatus(message || '', message ? 'bad' : '');
  if (!dlg.open) dlg.showModal();
}
function setStatus(text, kind){ const el = $('#setStatus'); el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }
function setProviderUi(){
  const p = document.querySelector('input[name=provider]:checked').value;
  $('#setGemini').hidden = p !== 'gemini'; $('#setCompat').hidden = p !== 'compat';
}
function readSettingsForm(){
  return Object.assign({}, state.settings, {
    provider: document.querySelector('input[name=provider]:checked').value,
    geminiKey: $('#setGeminiKey').value.trim(), model: $('#setGeminiModel').value.trim() || Core.DEFAULT_SETTINGS.model,
    compatBase: $('#setCompatBase').value.trim(), compatKey: $('#setCompatKey').value.trim(), compatModel: $('#setCompatModel').value.trim(),
    targetLang: $('#setLang').value, remember: $('#setRemember').checked
  });
}
function wireSettings(){
  for (const l of Core.TARGET_LANGS) $('#setLang').append(h('option', { value: l }, l));
  document.querySelectorAll('input[name=provider]').forEach(r => r.addEventListener('change', setProviderUi));
  $('#btnShowKey').addEventListener('click', () => { const i = $('#setGeminiKey'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#btnShowKey').textContent = show ? 'Hide' : 'Show'; });
  $('#btnCancelSet').addEventListener('click', () => $('#dlgSettings').close());
  $('#formSettings').addEventListener('submit', e => {
    e.preventDefault();
    state.settings = readSettingsForm(); saveSettings();
    $('#dlgSettings').close(); renderRight(); toast('Saved at the scribe’s desk.');
  });
  $('#btnTest').addEventListener('click', async () => {
    const s = readSettingsForm(); setStatus('Testing…', '');
    try { const reply = await Core.testConnection(s); setStatus('Connected. The model answered: ' + reply, 'ok'); }
    catch (e) { const d = Core.describeError(e); setStatus(d.title + '. ' + d.hint, 'bad'); }
  });
  $('#btnModels').addEventListener('click', async () => {
    const key = $('#setGeminiKey').value.trim(); setStatus('Looking up models…', '');
    try {
      const names = await Core.listGeminiModels(key);
      const dl = $('#modelList'); dl.replaceChildren(...['gemini-flash-latest', 'gemini-flash-lite-latest', ...names].filter((v, i, a) => a.indexOf(v) === i).map(n => h('option', { value: n })));
      setStatus(names.length + ' models are available to this key. Click the Model box to choose one.', 'ok');
    } catch (e) { const d = Core.describeError(e); setStatus(d.title + '. ' + d.hint, 'bad'); }
  });
}

/* ---------- shelf dialog ---------- */
function openShelf(){
  renderShelf(); const d = $('#dlgShelf'); if (!d.open) d.showModal();
}
function renderShelf(){
  const list = $('#shelfList'); list.replaceChildren();
  if (!state.shelf.length) { list.append(h('p', { class: 'shelf-empty' }, 'The shelf is empty. Folios you read will appear here.')); return; }
  for (const e of state.shelf) {
    list.append(h('div', { class: 'shelf-item' },
      h('img', { src: e.thumb || '', alt: '' }),
      h('div', null, h('h3', null, e.name), h('p', null, e.result.lines.length + ' lines, ' + e.result.script + ', read ' + e.savedAt.slice(0, 10))),
      h('div', { class: 'acts' },
        h('button', { class: 'quiet small', type: 'button', onclick: () => openFromShelf(e.id) }, 'Open'),
        h('button', { class: 'quiet small', type: 'button', 'aria-label': 'Remove ' + e.name + ' from the shelf', onclick: () => { state.shelf = state.shelf.filter(x => x.id !== e.id); saveShelf(); renderShelf(); } }, 'Remove'))));
  }
}
async function openFromShelf(id){
  const e = state.shelf.find(x => x.id === id); if (!e) return;
  const existing = state.folios.find(f => f.id === id);
  if (existing) { existing.result = e.result; existing.status = 'done'; }
  else {
    let img = null; if (e.thumb) { try { img = await loadImage(e.thumb); } catch (_) {} }
    state.folios.push({ id: e.id, name: e.name, url: null, img: img || new Image(), rotation: 0, base: null, adj: DEFAULT_ADJ(), showOriginal: false,
      status: 'done', result: e.result, error: null, thumb: e.thumb, restored: true });
  }
  $('#dlgShelf').close(); state.tab = 'written'; setActive(id);
}
function wireShelf(){
  $('#btnCloseShelf').addEventListener('click', () => $('#dlgShelf').close());
  $('#btnClearShelf').addEventListener('click', () => { if (!state.shelf.length) return; if (confirm('Remove every folio from the shelf?')) { state.shelf = []; saveShelf(); renderShelf(); } });
}

/* ---------- start ---------- */
(function init(){
  const live = h('div', { class: 'sr', id: 'liveStatus', role: 'status', 'aria-live': 'polite' });
  document.body.append(live);
  wireControls();
  render();
  globalThis.__pathaka = { state, addFiles, render, setActive, runReading };   // handy for debugging in the console
})();
})();
</script>

  scanNote: ["Upload a photograph or scan of a manuscript folio and an AI model reads it. First add your own API key under “Scribe’s desk” inside the reader. Machine readings need checking against the folio.","पांडुलिपि के पन्ने की फ़ोटो या स्कैन अपलोड करें, एक AI मॉडल उसे पढ़ेगा। पहले पाठक के भीतर “Scribe’s desk” में अपनी API कुंजी जोड़ें। मशीनी पाठ को पन्ने से मिलाकर जाँचें।","கையெழுத்துப்படி ஏட்டின் புகைப்படம் அல்லது ஸ்கேனைப் பதிவேற்றுங்கள்; AI மாதிரி அதைப் படிக்கும். முதலில் வாசிப்பானுக்குள் “Scribe’s desk” இல் உங்கள் API சாவியைச் சேர்க்கவும். இயந்திர வாசிப்பை ஏட்டுடன் ஒப்பிட்டுச் சரிபாருங்கள்.","వ్రాతప్రతి పత్రం ఫోటో లేదా స్కాన్‌ను అప్‌లోడ్ చేయండి; AI మోడల్ దానిని చదువుతుంది. ముందుగా పాఠకుని లోపల “Scribe’s desk” లో మీ API కీని జోడించండి. యంత్ర పఠనాన్ని పత్రంతో సరిచూసుకోండి."],

  noVoice:  ["This device has no {l} voice installed. Add one in your system’s speech settings, or the browser’s default voice will be used.","इस डिवाइस में {l} आवाज़ स्थापित नहीं है। सिस्टम की स्पीच सेटिंग में जोड़ें, अन्यथा ब्राउज़र की डिफ़ॉल्ट आवाज़ प्रयोग होगी।","இந்தச் சாதனத்தில் {l} குரல் நிறுவப்படவில்லை. சாதனத்தின் பேச்சு அமைப்புகளில் சேர்க்கவும்; இல்லையெனில் உலாவியின் இயல்பு குரல் பயன்படும்.","ఈ పరికరంలో {l} స్వరం ఇన్‌స్టాల్ కాలేదు. సిస్టమ్ స్పీచ్ సెట్టింగ్స్‌లో జోడించండి; లేకపోతే బ్రౌజర్ డిఫాల్ట్ స్వరం వాడబడుతుంది."],

  charsTitle:["Characters of the epic","महाकाव्य के पात्र","காவியத்தின் கதாபாத்திரங்கள்","ఇతిహాసంలోని పాత్రలు"],
  charsIntro:["Twelve figures from the story. Open a folio to read about them and hear their account.","कथा के बारह पात्र। उनके बारे में पढ़ने और सुनने के लिए पन्ना खोलें।","கதையின் பன்னிரண்டு கதாபாத்திரங்கள். அவர்களைப் பற்றிப் படிக்கவும் கேட்கவும் ஏட்டைத் திறக்கவும்.","కథలోని పన్నెండు పాత్రలు. వారి గురించి చదవడానికి, వినడానికి పత్రాన్ని తెరవండి."],

  timeIntro:["The story in order, from the vow of Bhishma to the last journey.","कथा क्रम से: भीष्म की प्रतिज्ञा से अन्तिम यात्रा तक।","கதை வரிசைப்படி: பீஷ்மரின் சபதம் முதல் இறுதிப் பயணம் வரை.","కథ వరుసగా: భీష్మ ప్రతిజ్ఞ నుండి చివరి ప్రయాణం వరకు."],
  listenAll:["Listen to the whole timeline","पूरा कालक्रम सुनें","முழு காலவரிசையையும் கேள்","మొత్తం కాలక్రమాన్ని వినండి"],
  quizTitle:["Test your memory of the epic","महाकाव्य के बारे में अपनी स्मृति परखें","காவியம் பற்றிய உங்கள் நினைவைச் சோதியுங்கள்","ఇతిహాసంపై మీ జ్ఞాపకశక్తిని పరీక్షించుకోండి"],
  quizIntro:["Ten questions drawn from the folios, characters and timeline. Your scores are saved to your account.","पन्नों, पात्रों और कालक्रम से दस प्रश्न। आपके अंक आपके खाते में सुरक्षित रहते हैं।","ஏடுகள், கதாபாத்திரங்கள், காலவரிசையிலிருந்து பத்துக் கேள்விகள். உங்கள் மதிப்பெண்கள் உங்கள் கணக்கில் சேமிக்கப்படும்.","పత్రాలు, పాత్రలు, కాలక్రమం నుండి పది ప్రశ్నలు. మీ మార్కులు మీ ఖాతాలో నిల్వ అవుతాయి."],
  gateText: ["Log in to take the quiz and keep your scores.","प्रश्नोत्तरी देने और अपने अंक सहेजने के लिए लॉग इन करें।","வினாடி வினா எழுதவும் மதிப்பெண்களைச் சேமிக்கவும் உள்நுழையுங்கள்.","క్విజ్ రాయడానికి, మార్కులు భద్రపరచుకోవడానికి లాగిన్ అవ్వండి."],

  great:    ["Splendid. You know the epic well.","बहुत बढ़िया। आप महाकाव्य को अच्छी तरह जानते हैं।","அருமை. நீங்கள் காவியத்தை நன்கு அறிந்திருக்கிறீர்கள்.","అద్భుతం. మీకు ఇతిహాసం బాగా తెలుసు."],
  good:     ["A good reading. Review the timeline and try again.","अच्छा प्रयास। कालक्रम दोहराकर फिर प्रयास करें।","நல்ல முயற்சி. காலவரிசையை மீண்டும் பார்த்து மறுபடி முயலுங்கள்.","మంచి ప్రయత్నం. కాలక్రమాన్ని మళ్ళీ చూసి మరోసారి ప్రయత్నించండి."],

  siteText: ["Pāṭhaka means “reader”. Here you can read retold folios of the Mahābhārata, hear a narrator read them aloud, meet the characters, follow the story on a timeline and test yourself with a quiz. Everything is available in English, Hindi, Tamil and Telugu.","‘पाठक’ का अर्थ है पढ़ने वाला। यहाँ आप महाभारत के पुनःकथित पन्ने पढ़ सकते हैं, वाचक से उन्हें सुन सकते हैं, पात्रों से मिल सकते हैं, कालक्रम पर कथा देख सकते हैं और प्रश्नोत्तरी से स्वयं को परख सकते हैं। सब कुछ अंग्रेज़ी, हिन्दी, तमिल और तेलुगु में उपलब्ध है।","‘பாடகர்’ என்பதன் பொருள் வாசிப்பவர். இங்கே மகாபாரதத்தின் மறுபடியுரைத்த ஏடுகளைப் படிக்கலாம், கதைசொல்லி படிப்பதைக் கேட்கலாம், கதாபாத்திரங்களைச் சந்திக்கலாம், காலவரிசையில் கதையைப் பின்தொடரலாம், வினாடி வினாவில் உங்களைச் சோதிக்கலாம். அனைத்தும் ஆங்கிலம், இந்தி, தமிழ், தெலுங்கில் கிடைக்கும்.","‘పాఠకుడు’ అంటే చదివేవాడు. ఇక్కడ మీరు మహాభారతంలోని పునఃకథిత పత్రాలను చదవవచ్చు, కథకుడు చదువుతుంటే వినవచ్చు, పాత్రలను కలవవచ్చు, కాలక్రమంలో కథను అనుసరించవచ్చు, క్విజ్‌తో మిమ్మల్ని పరీక్షించుకోవచ్చు. అన్నీ ఇంగ్లీష్, హిందీ, తమిళం, తెలుగులో లభిస్తాయి."],
  siteNote: ["The folios are short retellings with a few Sanskrit verses. They are not a scholarly edition, so check a critical edition before you quote.","ये पन्ने कुछ संस्कृत श्लोकों के साथ संक्षिप्त पुनःकथन हैं। ये विद्वत्संस्करण नहीं हैं, इसलिए उद्धरण से पहले समालोचनात्मक संस्करण देखें।","இந்த ஏடுகள் சில சமஸ்கிருத ஸ்லோகங்களுடன் கூடிய சுருக்கமான மறுபடியுரைகள். இவை ஆய்வுப் பதிப்பு அல்ல; மேற்கோள் காட்டுமுன் ஆய்வுப் பதிப்பைச் சரிபாருங்கள்.","ఈ పత్రాలు కొన్ని సంస్కృత శ్లోకాలతో కూడిన సంక్షిప్త పునఃకథనాలు. ఇవి పండిత పరిష్కృత సంచిక కావు; ఉటంకించే ముందు పరిష్కృత ప్రతిని సరిచూడండి."],
  footer:   ["Retellings for reading and listening. Check a critical edition before you cite.","पढ़ने और सुनने के लिए पुनःकथन। उद्धरण से पहले समालोचनात्मक संस्करण देखें।","படிக்கவும் கேட்கவும் மறுபடியுரைகள். மேற்கோளுக்கு முன் ஆய்வுப் பதிப்பைப் பாருங்கள்.","చదవడానికి, వినడానికి పునఃకథనాలు. ఉటంకించే ముందు పరిష్కృత ప్రతిని చూడండి."]

        "కుంతికి, ఇంద్రునికి పుట్టిన అర్జునుడు ద్రోణుని వద్ద నేర్చుకొని, స్వయంవరంలో ద్రౌపదిని గెలిచాడు; దేవతల నుండి దివ్యాస్త్రాలు పొందాడు. యుద్ధానికి ముందు తడబడినప్పుడు కృష్ణుని నుండి గీతను విని మళ్ళీ విల్లు చేపట్టాడు."] },
 { id:'yudhishthira', g:'pandava', name:L4("Yudhishthira|युधिष्ठिर|யுதிஷ்டிரன்|యుధిష్ఠిరుడు"),
   role:["Eldest Pandava, king of dharma","ज्येष्ठ पाण्डव, धर्मराज","மூத்த பாண்டவன், தர்மராஜன்","పెద్ద పాండవుడు, ధర్మరాజు"],
   bio:["Son of Kunti and Dharma, he was famed for truthfulness. He lost his kingdom, brothers and wife at dice, yet answered the yaksha’s questions with wisdom and finally refused heaven without the dog who had followed him.",
        "कुन्ती और धर्म के पुत्र युधिष्ठिर अपनी सत्यनिष्ठा के लिए प्रसिद्ध थे। उन्होंने जुए में राज्य, भाई और पत्नी को हार दिया, फिर भी यक्ष के प्रश्नों का ज्ञानपूर्वक उत्तर दिया और अन्त में अपने साथ चले कुत्ते के बिना स्वर्ग जाने से मना कर दिया।",
        "குந்திக்கும் தர்மதேவனுக்கும் பிறந்த யுதிஷ்டிரன் உண்மைக்குப் பெயர் பெற்றவன். சூதில் நாடு, சகோதரர், மனைவி அனைத்தையும் இழந்தாலும், யட்சனின் கேள்விகளுக்கு ஞானத்துடன் பதிலளித்தான்; இறுதியில் தன்னைத் தொடர்ந்து வந்த நாயை விட்டுவிட்டு சொர்க்கம் புக மறுத்தான்.",
        "కుంతికి, ధర్ముని కి పుట్టిన యుధిష్ఠిరుడు సత్యవచనానికి పేరుగాంచాడు. జూదంలో రాజ్యం, సోదరులు, భార్యను కోల్పోయినా, యక్షుని ప్రశ్నలకు జ్ఞానంతో సమాధానమిచ్చాడు; చివరికి తనను అనుసరించిన కుక్కను విడిచి స్వర్గానికి వెళ్ళనన్నాడు."] },
 { id:'bhima', g:'pandava', name:L4("Bhima|भीम|பீமன்|భీముడు"),
   role:["Second Pandava, the mighty wrestler","दूसरे पाण्डव, महाबली","இரண்டாம் பாண்டவன், மாபெரும் வீரன்","రెండవ పాండవుడు, మహాబలుడు"],
   bio:["Son of Kunti and the wind god Vayu, he had the strength of ten thousand elephants. He killed Hidimba, Baka and Kichaka, and fulfilled his oath by slaying Duryodhana with a mace.",
        "कुन्ती और वायुदेव के पुत्र भीम में दस हज़ार हाथियों का बल था। उन्होंने हिडिम्ब, बकासुर और कीचक का वध किया और गदा-युद्ध में दुर्योधन को मारकर अपनी प्रतिज्ञा पूरी की।",
        "குந்திக்கும் வாயுதேவனுக்கும் பிறந்த பீமனுக்குப் பத்தாயிரம் யானை பலம் இருந்தது. இடும்பன், பகாசுரன், கீசகன் ஆகியோரைக் கொன்றான்; கதைப்போரில் துரியோதனனை வீழ்த்தித் தன் சபதத்தை நிறைவேற்றினான்.",
        "కుంతికి, వాయుదేవునికి పుట్టిన భీమునికి పదివేల ఏనుగుల బలం ఉండేది. హిడింబుడు, బకుడు, కీచకుడిని సంహరించాడు; గదాయుద్ధంలో దుర్యోధనుని చంపి తన ప్రతిజ్ఞ నెరవేర్చాడు."] },
 { id:'draupadi', g:'pandava', name:L4("Draupadi|द्रौपदी|திரௌபதி|ద్రౌపది"),
   role:["Princess of Panchala, queen of the Pandavas","पांचाल की राजकुमारी, पाण्डवों की रानी","பாஞ்சால இளவரசி, பாண்டவர்களின் அரசி","పాంచాల రాకుమారి, పాండవుల రాణి"],
   bio:["Born from the sacrificial fire of King Drupada, she married the five Pandavas. Dragged into the assembly after the dice game, she questioned the elders on dharma, and her vow shaped the war.",
        "राजा द्रुपद के यज्ञ-कुण्ड से उत्पन्न द्रौपदी का विवाह पाँचों पाण्डवों से हुआ। जुए के बाद सभा में घसीटे जाने पर उन्होंने बड़ों से धर्म पर प्रश्न किया; उनकी प्रतिज्ञा ने युद्ध की दिशा तय की।",
        "துருபத மன்னனின் யாகத் தீயில் பிறந்த திரௌபதி ஐந்து பாண்டவர்களை மணந்தாள். சூதுக்குப் பின் சபைக்கு இழுத்து வரப்பட்டபோது பெரியோரிடம் தர்மம் குறித்துக் கேள்வி எழுப்பினாள்; அவளது சபதம் போரின் போக்கை வடிவமைத்தது.",
        "ద్రుపద మహారాజు యజ్ఞాగ్ని నుండి జన్మించిన ద్రౌపది ఐదుగురు పాండవులను వివాహమాడింది. జూదం తరువాత సభలోకి ఈడ్చుకు రాబడినప్పుడు పెద్దలను ధర్మం గురించి ప్రశ్నించింది; ఆమె ప్రతిజ్ఞ యుద్ధ గమనాన్ని మలిచింది."] },
 { id:'kunti', g:'pandava', name:L4("Kunti|कुन्ती|குந்தி|కుంతి"),
   role:["Mother of the three elder Pandavas","तीन ज्येष्ठ पाण्डवों की माता","மூன்று மூத்த பாண்டவர்களின் தாய்","ముగ్గురు పెద్ద పాండవుల తల్లి"],
   bio:["She received a mantra from the sage Durvasa that could summon any god to give her a son. She bore Karna secretly, then Yudhishthira, Bhima and Arjuna, and raised all five Pandavas through exile.",
        "ऋषि दुर्वासा से उन्हें ऐसा मन्त्र मिला जिससे किसी भी देवता को बुलाकर पुत्र पाया जा सकता था। उन्होंने गुप्त रूप से कर्ण को जन्म दिया, फिर युधिष्ठिर, भीम और अर्जुन को, और वनवास में पाँचों पाण्डवों को पाला।",
        "துர்வாச முனிவரிடமிருந்து எந்தத் தெய்வத்தையும் அழைத்து மகனைப் பெறும் மந்திரத்தைப் பெற்றாள். கர்ணனை ரகசியமாகப் பெற்றாள்; பின் யுதிஷ்டிரன், பீமன், அர்ஜுனன்; வனவாசத்தில் ஐவரையும் வளர்த்தாள்.",
        "దుర్వాస మహర్షి నుండి ఏ దేవుడినైనా పిలిచి కుమారుని పొందగల మంత్రాన్ని పొందింది. కర్ణుని రహస్యంగా కన్నది; తరువాత యుధిష్ఠిరుడు, భీముడు, అర్జునులను; వనవాసంలో ఐదుగురినీ పెంచింది."] },
 { id:'karna', g:'kaurava', name:L4("Karna|कर्ण|கர்ணன்|కర్ణుడు"),
   role:["Generous warrior, king of Anga","दानवीर योद्धा, अंगराज","கொடை வீரன், அங்க தேசத்து அரசன்","దానశూరుడైన యోధుడు, అంగరాజు"],
   bio:["Born to Kunti before her marriage and raised by a charioteer, he was crowned king of Anga by Duryodhana, whose friendship he never abandoned. He gave away his armour to Indra and fell to Arjuna on the seventeenth day.",
        "कुन्ती के विवाह से पहले जन्मे और सूत के घर पले कर्ण को दुर्योधन ने अंग का राजा बनाया; उन्होंने उसकी मित्रता कभी नहीं छोड़ी। उन्होंने इन्द्र को अपना कवच दान कर दिया और सत्रहवें दिन अर्जुन के हाथों वीरगति पाई।",
        "குந்திக்குத் திருமணத்துக்கு முன் பிறந்து, தேரோட்டியின் வீட்டில் வளர்ந்த கர்ணனை துரியோதனன் அங்க நாட்டு அரசனாக்கினான்; அந்த நட்பை அவன் ஒருபோதும் கைவிடவில்லை. இந்திரனுக்குத் தன் கவசத்தைக் கொடுத்தான்; பதினேழாம் நாள் அர்ஜுனனால் வீழ்ந்தான்.",
        "కుంతికి వివాహానికి ముందు పుట్టి, సారథి ఇంట పెరిగిన కర్ణుని దుర్యోధనుడు అంగరాజును చేశాడు; ఆ స్నేహాన్ని అతడు ఎన్నడూ విడువలేదు. ఇంద్రునికి తన కవచాన్ని దానం చేశాడు; పదిహేడవ రోజున అర్జునుని చేతిలో పడిపోయాడు."] },
 { id:'duryodhana', g:'kaurava', name:L4("Duryodhana|दुर्योधन|துரியோதனன்|దుర్యోధనుడు"),
   role:["Eldest Kaurava, prince of Hastinapura","ज्येष्ठ कौरव, हस्तिनापुर के राजकुमार","மூத்த கௌரவன், ஹஸ்தினாபுர இளவரசன்","పెద్ద కౌరవుడు, హస్తినాపుర రాకుమారుడు"],
   bio:["Eldest son of Dhritarashtra and Gandhari, he could not bear the Pandavas’ rise and refused to give them even five villages. He fell at the end of the eighteenth day, struck down by Bhima.",
        "धृतराष्ट्र और गान्धारी के ज्येष्ठ पुत्र दुर्योधन पाण्डवों का उत्थान सह न सके और उन्हें पाँच गाँव देने से भी इनकार कर दिया। अठारहवें दिन के अन्त में भीम के प्रहार से उनका पतन हुआ।",
        "திருதராஷ்டிரன், காந்தாரி ஆகியோரின் மூத்த மகன் துரியோதனன், பாண்டவர்களின் உயர்வைப் பொறுக்க முடியாமல் ஐந்து கிராமங்களைக் கூடக் கொடுக்க மறுத்தான். பதினெட்டாம் நாள் முடிவில் பீமனால் வீழ்த்தப்பட்டான்.",
        "ధృతరాష్ట్రుడు, గాంధారి పెద్ద కుమారుడు దుర్యోధనుడు పాండవుల ఎదుగుదలను సహించలేక ఐదు గ్రామాలైనా ఇవ్వనన్నాడు. పద్దెనిమిదవ రోజు చివర భీముని చేతిలో నేలకూలాడు."] },
 { id:'gandhari', g:'kaurava', name:L4("Gandhari|गान्धारी|காந்தாரி|గాంధారి"),
   role:["Queen of Hastinapura, mother of the hundred Kauravas","हस्तिनापुर की रानी, सौ कौरवों की माता","ஹஸ்தினாபுர அரசி, நூறு கௌரவர்களின் தாய்","హస్తినాపుర రాణి, నూరుగురు కౌరవుల తల్లి"],
   bio:["Princess of Gandhara, she bound a cloth over her eyes for life when she learned her husband Dhritarashtra was blind. She grieved for her sons, and at war’s end she spoke a curse upon Krishna.",
        "गान्धार की राजकुमारी गान्धारी ने जब जाना कि पति धृतराष्ट्र अन्धे हैं, तो जीवन भर के लिए अपनी आँखों पर पट्टी बाँध ली। पुत्रों के शोक में उन्होंने युद्ध के अन्त में कृष्ण को शाप दिया।",
        "காந்தார நாட்டு இளவரசி காந்தாரி, கணவன் திருதராஷ்டிரன் பார்வையற்றவன் என அறிந்ததும் வாழ்நாள் முழுவதும் தன் கண்களைத் துணியால் கட்டிக்கொண்டாள். மகன்களை இழந்த துயரில் போர் முடிவில் கிருஷ்ணனுக்குச் சாபமிட்டாள்.",
        "గాంధార రాకుమారి గాంధారి, భర్త ధృతరాష్ట్రుడు అంధుడని తెలిసి జీవితాంతం తన కళ్ళకు గంతలు కట్టుకుంది. కుమారులను కోల్పోయిన దుఃఖంతో యుద్ధం ముగిశాక కృష్ణునికి శాపమిచ్చింది."] },
 { id:'drona', g:'kaurava', name:L4("Drona|द्रोण|துரோணர்|ద్రోణుడు"),
   role:["Teacher of the Kuru princes","कुरु राजकुमारों के गुरु","குரு இளவரசர்களின் ஆசான்","కురు రాకుమారుల గురువు"],
   bio:["A brahmin master of archery, he taught both Pandavas and Kauravas, and favoured Arjuna as his finest pupil. He led the Kaurava army after Bhishma and fell on the fifteenth day.",
        "धनुर्विद्या के आचार्य ब्राह्मण द्रोण ने पाण्डवों और कौरवों दोनों को सिखाया और अर्जुन को अपना सर्वश्रेष्ठ शिष्य माना। भीष्म के बाद उन्होंने कौरव सेना का नेतृत्व किया और पन्द्रहवें दिन गिरे।",
        "வில்வித்தையில் தேர்ந்த அந்தண ஆசானான துரோணர் பாண்டவர், கௌரவர் இருவருக்கும் கற்பித்தார்; அர்ஜுனனைச் சிறந்த சீடனாகக் கருதினார். பீஷ்மருக்குப் பின் கௌரவ சேனையை நடத்தி பதினைந்தாம் நாள் வீழ்ந்தார்.",
        "విలువిద్యలో నిష్ణాతుడైన బ్రాహ్మణ గురువు ద్రోణుడు పాండవులకు, కౌరవులకు ఇద్దరికీ నేర్పాడు; అర్జునుని ఉత్తమ శిష్యునిగా భావించాడు. భీష్ముని తరువాత కౌరవ సేనను నడిపి పదిహేనవ రోజున పడిపోయాడు."] }

const PASSAGES = [
 { id:'p1', parva:'adi', title:L4("The invocation|मंगलाचरण|மங்கல வணக்கம்|మంగళాచరణ"),
   verse:{ dev:"नारायणं नमस्कृत्य नरं चैव नरोत्तमम् ।\nदेवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥",
           iast:"nārāyaṇaṃ namaskṛtya naraṃ caiva narottamam |\ndevīṃ sarasvatīṃ caiva tato jayam udīrayet ||",
           meaning:["Having bowed to Narayana, to Nara the best of men, and to the goddess Sarasvati, one should then speak the word Jaya, victory.",
                    "नारायण, नरों में श्रेष्ठ नर और देवी सरस्वती को प्रणाम करके तब ‘जय’ का उच्चारण करना चाहिए।",
                    "நாராயணனையும், மனிதருள் சிறந்த நரனையும், சரஸ்வதி தேவியையும் வணங்கிய பின் ‘ஜயம்’ என்ற காவியத்தைக் கூற வேண்டும்.",
                    "నారాయణునికి, నరోత్తముడైన నరునికి, సరస్వతీ దేవికి నమస్కరించి, ఆ తరువాత ‘జయ’ అనే కావ్యాన్ని పఠించాలి."] },
   text:["The Mahabharata begins with a bow to the divine and a promise of victory. Tradition says the poet Vyasa composed it in his mind and called it Jaya. Ganesha agreed to write it down, on one condition: that the sage never pause in his dictation. Vyasa answered with a condition of his own, that Ganesha must understand every verse before writing it. Later the tale grew to Bharata, and then to the Mahabharata, the great story of the descendants of Bharata.",
         "महाभारत का आरम्भ ईश्वर को प्रणाम और विजय के संकल्प से होता है। परम्परा कहती है कि कवि व्यास ने इसे मन में रचा और इसका नाम ‘जय’ रखा। गणेश ने इसे लिखना स्वीकार किया, पर एक शर्त पर कि मुनि बीच में कभी रुकें नहीं। व्यास ने अपनी शर्त रखी कि गणेश हर श्लोक को समझकर ही लिखें। आगे चलकर यह कथा ‘भारत’ बनी और फिर ‘महाभारत’, भरत के वंशजों की महान गाथा।",
         "மகாபாரதம் இறைவனுக்கு வணக்கம் செலுத்தி, வெற்றியின் உறுதிமொழியுடன் தொடங்குகிறது. கவிஞர் வியாசர் இதை மனதிலேயே இயற்றி ‘ஜயம்’ என்று பெயரிட்டார் என்கிறது மரபு. இதை எழுத விநாயகர் ஒப்புக்கொண்டார்; ஆனால் முனிவர் சொல்வதை இடையில் நிறுத்தக்கூடாது என்பது அவரது நிபந்தனை. வியாசர், ஒவ்வொரு ஸ்லோகத்தையும் புரிந்துகொண்டே எழுத வேண்டும் என்று தம் நிபந்தனையை வைத்தார். பின்னர் இந்தக் கதை ‘பாரதம்’ ஆகி, பரதனின் வழித்தோன்றல்களின் பெருங்கதையாக ‘மகாபாரதம்’ ஆனது.",
         "మహాభారతం దైవానికి నమస్కారంతో, విజయ సంకల్పంతో మొదలవుతుంది. కవి వ్యాసుడు దీనిని మనసులోనే రచించి ‘జయ’ అని పేరు పెట్టాడని సంప్రదాయం చెబుతుంది. వినాయకుడు దీనిని వ్రాయడానికి ఒప్పుకున్నాడు, కానీ ఋషి చెప్పడం మధ్యలో ఆపకూడదని షరతు పెట్టాడు. వ్యాసుడు ప్రతి శ్లోకాన్ని అర్థం చేసుకున్నాకే వ్రాయాలని తన షరతు పెట్టాడు. తరువాత ఈ కథ ‘భారతం’గా, ఆపై భరతుని వారసుల మహాగాథ అయిన ‘మహాభారతం’గా విస్తరించింది."] },

 { id:'p2', parva:'adi', title:L4("The vow of Bhishma|भीष्म की प्रतिज्ञा|பீஷ்மரின் சபதம்|భీష్మ ప్రతిజ్ఞ"),
   text:["King Shantanu fell in love with Satyavati, the daughter of a fisher chief. Her father would give her in marriage only if her sons would inherit the throne. Prince Devavrata, Shantanu’s heir, went to the chief and gave up his claim. To remove every doubt he also vowed never to marry, so that no son of his could ever rival Satyavati’s children. The gods rained flowers and called him Bhishma, the one of the terrible oath.",
         "राजा शान्तनु निषादराज की पुत्री सत्यवती पर मोहित हो गए। उसके पिता इस शर्त पर ही विवाह करने को तैयार थे कि सत्यवती के पुत्र ही राजा बनें। शान्तनु के उत्तराधिकारी राजकुमार देवव्रत ने निषादराज के पास जाकर अपना अधिकार छोड़ दिया। हर शंका मिटाने के लिए उन्होंने कभी विवाह न करने की भी प्रतिज्ञा की, ताकि उनकी सन्तान कभी सत्यवती के पुत्रों की प्रतिद्वन्द्वी न बने। देवताओं ने पुष्प बरसाए और उन्हें ‘भीष्म’ कहा, यानी भीषण प्रतिज्ञा करने वाला।",
         "மன்னன் சந்தனு மீனவர் தலைவனின் மகள் சத்தியவதியின் மீது காதல் கொண்டான். தன் மகளின் பிள்ளைகளே அரசாள வேண்டும் என்றால்தான் திருமணம் என்றான் அவள் தந்தை. சந்தனுவின் வாரிசான இளவரசன் தேவவிரதன் அவரிடம் சென்று தன் உரிமையைத் துறந்தான். எல்லாச் சந்தேகத்தையும் நீக்க, தன் வழித்தோன்றல் சத்தியவதியின் பிள்ளைகளுக்குப் போட்டியாகாதபடி, திருமணமே செய்வதில்லை என்றும் சபதம் செய்தான். தேவர்கள் மலர் பொழிந்து, கடுமையான சபதம் செய்தவன் என்ற பொருளில் அவனைப் ‘பீஷ்மன்’ என்றனர்.",
         "శంతను మహారాజు జాలరుల నాయకుని కుమార్తె సత్యవతిని ప్రేమించాడు. ఆమె కుమారులే రాజ్యానికి వారసులైతేనే పెళ్ళికి ఒప్పుకుంటానన్నాడు ఆమె తండ్రి. శంతనుని వారసుడైన దేవవ్రతుడు ఆ నాయకుని వద్దకు వెళ్లి తన హక్కును విడిచిపెట్టాడు. సందేహాలన్నీ తొలగించడానికి తన సంతానం సత్యవతి పుత్రులకు ఎప్పటికీ పోటీ కాకుండా ఉండేందుకు పెళ్ళే చేసుకోనని కూడా ప్రతిజ్ఞ చేశాడు. దేవతలు పూలవాన కురిపించి, భయంకర ప్రతిజ్ఞ చేసినవాడని అర్థంలో అతనిని ‘భీష్ముడు’ అన్నారు."] },

 { id:'p3', parva:'sabha', title:L4("The game of dice|द्यूत-सभा|சூதாட்டச் சபை|ద్యూత సభ"),
   text:["Duryodhana, burning with envy, invited Yudhishthira to a game of dice at Hastinapura. Shakuni played for him, and the dice always fell his way. Yudhishthira staked his wealth, his kingdom, his brothers, himself, and at last Draupadi. She was dragged into the hall and asked a question no elder could answer: whether a man who had already lost himself could stake her. Dhritarashtra finally restored their freedom, but a second game sent the Pandavas into thirteen years of exile.",
         "ईर्ष्या से जलते दुर्योधन ने युधिष्ठिर को हस्तिनापुर में द्यूत के लिए बुलाया। उनकी ओर से शकुनि खेला और पासे हमेशा उसी के पक्ष में पड़े। युधिष्ठिर ने धन, राज्य, भाइयों, स्वयं को और अन्त में द्रौपदी को दाँव पर लगा दिया। द्रौपदी को सभा में घसीटा गया और उन्होंने ऐसा प्रश्न पूछा जिसका उत्तर कोई बड़ा न दे सका: क्या स्वयं को हार चुका व्यक्ति उन्हें दाँव पर लगा सकता है? धृतराष्ट्र ने अन्त में उनकी स्वतन्त्रता लौटा दी, पर दूसरे खेल ने पाण्डवों को तेरह वर्ष के वनवास में भेज दिया।",
         "பொறாமையில் கொதித்த துரியோதனன் யுதிஷ்டிரனை ஹஸ்தினாபுரத்தில் சூதாட அழைத்தான். அவனுக்காகச் சகுனி ஆடினான்; பகடை எப்போதும் அவன் பக்கமே விழுந்தது. யுதிஷ்டிரன் தன் செல்வம், நாடு, சகோதரர்கள், தன்னையே, கடைசியில் திரௌபதியையும் பணயம் வைத்தான். சபைக்கு இழுத்து வரப்பட்ட திரௌபதி, தன்னையே இழந்த ஒருவன் தன்னைப் பணயம் வைக்கலாமா என்ற கேள்வியை எழுப்பினாள்; பெரியோர் எவராலும் அதற்குப் பதில் சொல்ல முடியவில்லை. இறுதியில் திருதராஷ்டிரன் அவர்களுக்கு விடுதலை அளித்தான்; ஆனால் இரண்டாம் ஆட்டம் பாண்டவர்களைப் பதின்மூன்று ஆண்டு வனவாசத்துக்கு அனுப்பியது.",
         "అసూయతో మండిపడుతున్న దుర్యోధనుడు యుధిష్ఠిరుని హస్తినాపురంలో జూదానికి పిలిచాడు. అతని తరఫున శకుని ఆడాడు; పాచికలు ఎప్పుడూ అతని వైపే పడ్డాయి. యుధిష్ఠిరుడు సంపద, రాజ్యం, సోదరులు, తనను తాను, చివరకు ద్రౌపదిని పణంగా పెట్టాడు. సభలోకి ఈడ్చుకు వచ్చిన ద్రౌపది, తనను తాను ఓడిపోయినవాడు తనను పణం పెట్టగలడా అని అడిగింది; పెద్దలలో ఎవరూ సమాధానం చెప్పలేకపోయారు. చివరికి ధృతరాష్ట్రుడు వారికి స్వేచ్ఛ ఇచ్చాడు; కానీ రెండవ ఆట పాండవులను పదమూడేళ్ల వనవాసానికి పంపింది."] },

 { id:'p4', parva:'bhishma', title:L4("Arjuna’s doubt|अर्जुन का विषाद|அர்ஜுனனின் தயக்கம்|అర్జునుని విషాదం"),
   verse:{ dev:"कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥",
           iast:"karmaṇy evādhikāras te mā phaleṣu kadācana |\nmā karmaphalahetur bhūr mā te saṅgo ’stv akarmaṇi ||",
           meaning:["You have a right to action alone, never to its fruits. Do not let the fruit be your motive, and do not cling to inaction.",
                    "तुम्हारा अधिकार केवल कर्म पर है, फल पर कभी नहीं। कर्मफल को अपना हेतु मत बनाओ और अकर्म में भी आसक्ति मत रखो।",
                    "உனக்குச் செயலில் மட்டுமே உரிமை உண்டு; அதன் பலனில் ஒருபோதும் இல்லை. பலனைச் செயலுக்கான காரணமாகக் கொள்ளாதே; செயலின்மையிலும் பற்று வைக்காதே.",
                    "నీకు కర్మపైనే అధికారం, ఫలాలపై ఎన్నడూ లేదు. కర్మఫలాన్ని కారణంగా చేసుకోకు; అకర్మపై కూడా ఆసక్తి వద్దు."] },
   text:["The two armies stood facing each other on the field of Kurukshetra. Arjuna saw teachers, cousins and friends in the opposing ranks, and his bow slipped from his hand. He told Krishna that he would rather not fight at all. Krishna, who held his reins, reminded him that duty must be done without clinging to its reward. Sanjaya, gifted with far sight, described all of it to the blind king Dhritarashtra.",
         "कुरुक्षेत्र के मैदान में दोनों सेनाएँ आमने-सामने खड़ी थीं। विरोधी पंक्तियों में गुरुजनों, भाइयों और मित्रों को देखकर अर्जुन के हाथ से धनुष छूट गया। उन्होंने कृष्ण से कहा कि वे युद्ध करना ही नहीं चाहते। रथ की बागडोर थामे कृष्ण ने उन्हें याद दिलाया कि कर्तव्य फल की आसक्ति के बिना करना चाहिए। दूरदृष्टि पाए सञ्जय ने यह सब अन्धे राजा धृतराष्ट्र को सुनाया।",
         "குருக்ஷேத்திரக் களத்தில் இரு சேனைகளும் எதிரெதிரே நின்றன. எதிரணியில் ஆசான்களையும் உறவினர்களையும் நண்பர்களையும் கண்ட அர்ஜுனனின் கையிலிருந்து வில் நழுவியது. தான் போரிடவே விரும்பவில்லை என்று கிருஷ்ணனிடம் சொன்னான். கடிவாளம் பிடித்திருந்த கிருஷ்ணன், கடமையைப் பலனில் பற்றின்றிச் செய்ய வேண்டும் என்று நினைவூட்டினான். தொலைநோக்குப் பெற்ற சஞ்சயன் இவை அனைத்தையும் பார்வையற்ற மன்னன் திருதராஷ்டிரனுக்கு விவரித்தான்.",
         "కురుక్షేత్ర రణభూమిలో రెండు సేనలు ఎదురెదురుగా నిలిచాయి. ఎదుటి పంక్తులలో గురువులను, బంధువులను, మిత్రులను చూసి అర్జునుని చేతిలోంచి విల్లు జారిపోయింది. తాను యుద్ధమే చేయనని కృష్ణునితో అన్నాడు. పగ్గాలు పట్టుకున్న కృష్ణుడు, కర్తవ్యాన్ని ఫలాసక్తి లేకుండా చేయాలని గుర్తు చేశాడు. దివ్యదృష్టి పొందిన సంజయుడు ఇదంతా అంధరాజు ధృతరాష్ట్రునికి వివరించాడు."] },

 { id:'p5', parva:'bhishma', title:L4("Krishna’s promise|कृष्ण का वचन|கிருஷ்ணனின் வாக்கு|కృష్ణుని వాగ్దానం"),
   verse:{ dev:"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।\nअभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥",
           iast:"yadā yadā hi dharmasya glānir bhavati bhārata |\nabhyutthānam adharmasya tadātmānaṃ sṛjāmy aham ||",
           meaning:["Whenever righteousness declines, O Bharata, and unrighteousness rises, then I bring myself forth.",
                    "हे भारत, जब-जब धर्म की हानि होती है और अधर्म बढ़ता है, तब-तब मैं स्वयं को प्रकट करता हूँ।",
                    "பாரதா, தர்மம் குன்றி அதர்மம் ஓங்கும்போதெல்லாம், நான் என்னைத் தோற்றுவித்துக்கொள்கிறேன்.",
                    "ఓ భారతా, ధర్మానికి హాని కలిగి అధర్మం పెరిగినప్పుడల్లా నేను నన్ను సృష్టించుకుంటాను."] },
   text:["Krishna went on to teach Arjuna about the self that is never born and never dies. He spoke of the paths of action, devotion and knowledge, and promised to return whenever dharma fades. Then he showed Arjuna his vast universal form, and Arjuna bowed in awe. Steadied, Arjuna lifted his bow, and the war began. It lasted eighteen days and left the field of Kurukshetra nearly empty of kings.",
         "कृष्ण ने आगे अर्जुन को उस आत्मा के बारे में बताया जो न कभी जन्म लेती है और न मरती है। उन्होंने कर्म, भक्ति और ज्ञान के मार्ग बताए और वचन दिया कि जब-जब धर्म क्षीण होगा, वे लौटेंगे। फिर उन्होंने अर्जुन को अपना विराट रूप दिखाया और अर्जुन श्रद्धा से झुक गए। स्थिर होकर अर्जुन ने धनुष उठाया और युद्ध आरम्भ हुआ। वह अठारह दिन चला और कुरुक्षेत्र लगभग राजाओं से खाली हो गया।",
         "பிறப்பும் இறப்புமற்ற ஆன்மாவைப் பற்றிக் கிருஷ்ணன் மேலும் உபதேசித்தான். செயல், பக்தி, ஞானம் ஆகிய வழிகளைப் பேசினான்; தர்மம் குன்றும்போதெல்லாம் தான் வருவதாக வாக்களித்தான். பின் தன் பேருருவை அர்ஜுனனுக்குக் காட்டினான்; அர்ஜுனன் வியப்புடன் வணங்கினான். தெளிந்த அர்ஜுனன் வில்லை எடுத்தான்; போர் தொடங்கியது. அது பதினெட்டு நாட்கள் நீடித்து, குருக்ஷேத்திரத்தை ஏறக்குறைய அரசர்களற்றதாக ஆக்கியது.",
         "పుట్టుక, చావు లేని ఆత్మ గురించి కృష్ణుడు మరింత బోధించాడు. కర్మ, భక్తి, జ్ఞాన మార్గాలను చెప్పాడు; ధర్మం క్షీణించినప్పుడల్లా తాను వస్తానని వాగ్దానం చేశాడు. తరువాత తన విశ్వరూపాన్ని అర్జునునికి చూపాడు; అర్జునుడు భక్తితో నమస్కరించాడు. స్థిరపడిన అర్జునుడు విల్లు ఎత్తాడు; యుద్ధం మొదలైంది. అది పద్దెనిమిది రోజులు సాగి, కురుక్షేత్రాన్ని దాదాపు రాజులు లేనిదిగా చేసింది."] },

 { id:'p6', parva:'mahaprasthanika', title:L4("The last journey|अन्तिम यात्रा|இறுதிப் பயணம்|చివరి ప్రయాణం"),
   text:["After thirty-six years of rule, the Pandavas gave the throne to Parikshit and set out for the Himalaya with Draupadi and a stray dog. One by one Draupadi and four brothers fell on the way, and Yudhishthira walked on without looking back. When Indra came with a chariot, he refused to enter heaven unless the dog could come too. The dog was Dharma himself, who had come to test him. Yudhishthira’s steadiness, say the tellers, is the final lesson of the epic.",
         "छत्तीस वर्ष शासन करने के बाद पाण्डवों ने सिंहासन परीक्षित को सौंपा और द्रौपदी तथा एक आवारा कुत्ते के साथ हिमालय की ओर चल पड़े। राह में एक-एक कर द्रौपदी और चार भाई गिर गए, और युधिष्ठिर बिना पीछे देखे आगे बढ़ते रहे। जब इन्द्र रथ लेकर आए, तो उन्होंने कुत्ते के बिना स्वर्ग में प्रवेश करने से मना कर दिया। वह कुत्ता स्वयं धर्म था, जो उनकी परीक्षा लेने आया था। कथावाचक कहते हैं कि युधिष्ठिर की यह दृढ़ता ही महाकाव्य की अन्तिम शिक्षा है।",
         "முப்பத்தாறு ஆண்டுகள் ஆட்சி செய்தபின் பாண்டவர்கள் அரியணையைப் பரீட்சித்துக்கு அளித்து, திரௌபதியுடனும் ஒரு தெருநாயுடனும் இமயமலை நோக்கிப் புறப்பட்டனர். வழியில் திரௌபதியும் நான்கு சகோதரர்களும் ஒவ்வொருவராக விழுந்தனர்; யுதிஷ்டிரன் திரும்பிப் பார்க்காமல் நடந்தான். இந்திரன் தேருடன் வந்தபோது, நாயும் உடன் வராவிட்டால் சொர்க்கத்தில் நுழைய மாட்டேன் என்றான். அந்த நாய் தர்மதேவனே; அவனைச் சோதிக்க வந்திருந்தான். யுதிஷ்டிரனின் இந்த உறுதியே காவியத்தின் இறுதிப் பாடம் என்கிறார்கள் கதை சொல்வோர்.",
         "ముప్పై ఆరు సంవత్సరాలు పాలించిన తరువాత పాండవులు సింహాసనాన్ని పరీక్షిత్తుకు అప్పగించి, ద్రౌపదితో, ఒక వీధి కుక్కతో హిమాలయాల వైపు బయలుదేరారు. దారిలో ద్రౌపది, నలుగురు సోదరులు ఒక్కొక్కరుగా పడిపోయారు; యుధిష్ఠిరుడు వెనక్కి చూడకుండా నడిచాడు. ఇంద్రుడు రథంతో వచ్చినప్పుడు, కుక్క కూడా రాకపోతే స్వర్గంలోకి అడుగుపెట్టనన్నాడు. ఆ కుక్క ధర్మదేవుడే; అతనిని పరీక్షించడానికి వచ్చాడు. యుధిష్ఠిరుని ఈ స్థిరత్వమే ఇతిహాసపు చివరి పాఠమని కథకులు చెబుతారు."] }
];

 { p:'adi', t:L4("Bhishma’s vow|भीष्म की प्रतिज्ञा|பீஷ்மரின் சபதம்|భీష్మ ప్రతిజ్ఞ"),
   d:["Devavrata renounces the throne and marriage so that King Shantanu may wed Satyavati, and is thereafter called Bhishma.","देवव्रत राजा शान्तनु के सत्यवती से विवाह के लिए राज्य और विवाह का त्याग करते हैं और तब से भीष्म कहलाते हैं।","மன்னன் சந்தனு சத்தியவதியை மணக்கும்பொருட்டு தேவவிரதன் அரசையும் திருமணத்தையும் துறக்கிறான்; அன்று முதல் பீஷ்மர் என அழைக்கப்படுகிறான்.","శంతను మహారాజు సత్యవతిని వివాహమాడటానికి దేవవ్రతుడు రాజ్యాన్ని, వివాహాన్ని త్యజిస్తాడు; అప్పటినుండి భీష్ముడని పిలువబడతాడు."] },

   d:["After King Vichitravirya dies childless, Vyasa fathers Dhritarashtra, Pandu and Vidura.","राजा विचित्रवीर्य के निःसन्तान मरने पर व्यास धृतराष्ट्र, पाण्डु और विदुर के पिता बनते हैं।","மன்னன் விசித்திரவீரியன் மகவின்றி இறந்தபின் வியாசர் திருதராஷ்டிரன், பாண்டு, விதுரன் ஆகியோருக்குத் தந்தையாகிறார்.","విచిత్రవీర్యుడు సంతానం లేకుండా మరణించాక వ్యాసుడు ధృతరాష్ట్రుడు, పాండు, విదురులకు తండ్రి అవుతాడు."] },
 { p:'adi', t:L4("The cousins are born|चचेरे भाइयों का जन्म|உறவினர்களின் பிறப்பு|బంధువుల జననం"),
   d:["Pandu’s wives Kunti and Madri bear the five Pandavas, while Gandhari bears a hundred sons and a daughter. Duryodhana is the eldest.","पाण्डु की पत्नियाँ कुन्ती और माद्री पाँच पाण्डवों को जन्म देती हैं, और गान्धारी सौ पुत्रों और एक पुत्री को। दुर्योधन सबसे बड़ा है।","பாண்டுவின் மனைவிகளான குந்தியும் மாத்ரியும் ஐந்து பாண்டவர்களைப் பெறுகிறார்கள்; காந்தாரி நூறு மகன்களையும் ஒரு மகளையும் பெறுகிறாள். துரியோதனன் மூத்தவன்.","పాండు భార్యలు కుంతి, మాద్రి ఐదుగురు పాండవులను కంటారు; గాంధారి నూరుగురు కుమారులను, ఒక కుమార్తెను కంటుంది. దుర్యోధనుడు పెద్దవాడు."] },
 { p:'adi', t:L4("The tournament at Hastinapura|हस्तिनापुर की रंगभूमि|ஹஸ்தினாபுர அரங்கேற்றம்|హస్తినాపుర రంగప్రవేశం"),
   d:["Drona trains the princes; at the public display Arjuna shines, and Karna appears and challenges him.","द्रोण राजकुमारों को सिखाते हैं; सार्वजनिक प्रदर्शन में अर्जुन चमकते हैं और कर्ण आकर उन्हें चुनौती देता है।","துரோணர் இளவரசர்களுக்குப் பயிற்சி அளிக்கிறார்; பொது அரங்கில் அர்ஜுனன் ஒளிர்கிறான், கர்ணன் தோன்றி அவனுக்குச் சவால் விடுகிறான்.","ద్రోణుడు రాకుమారులకు శిక్షణ ఇస్తాడు; బహిరంగ ప్రదర్శనలో అర్జునుడు మెరుస్తాడు, కర్ణుడు వచ్చి అతనిని సవాలు చేస్తాడు."] },
 { p:'adi', t:L4("The house of lac|लाक्षागृह|அரக்கு மாளிகை|లక్క ఇల్లు"),
   d:["Duryodhana plots to burn the Pandavas in a palace of lac; warned by Vidura, they escape through a tunnel.","दुर्योधन लाख के महल में पाण्डवों को जलाने की योजना बनाता है; विदुर की चेतावनी से वे सुरंग से निकल जाते हैं।","துரியோதனன் அரக்கு மாளிகையில் பாண்டவர்களை எரிக்கச் சதி செய்கிறான்; விதுரனின் எச்சரிக்கையால் அவர்கள் சுரங்கம் வழியாகத் தப்புகிறார்கள்.","దుర్యోధనుడు లక్క భవనంలో పాండవులను కాల్చాలని కుట్ర చేస్తాడు; విదురుని హెచ్చరికతో వారు సొరంగం ద్వారా తప్పించుకుంటారు."] },
 { p:'adi', t:L4("Draupadi’s swayamvara|द्रौपदी का स्वयंवर|திரௌபதி சுயம்வரம்|ద్రౌపదీ స్వయంవరం"),
   d:["Arjuna strings a mighty bow and hits the target, winning Draupadi, who becomes the wife of all five brothers.","अर्जुन भारी धनुष चढ़ाकर लक्ष्य भेदते हैं और द्रौपदी को जीतते हैं, जो पाँचों भाइयों की पत्नी बनती हैं।","அர்ஜுனன் கடினமான வில்லை வளைத்து இலக்கை வீழ்த்தித் திரௌபதியை வெல்கிறான்; அவள் ஐந்து சகோதரர்களுக்கும் மனைவியாகிறாள்.","అర్జునుడు బరువైన విల్లు ఎక్కుపెట్టి లక్ష్యాన్ని కొట్టి ద్రౌపదిని గెలుస్తాడు; ఆమె ఐదుగురు సోదరులకు భార్య అవుతుంది."] },
 { p:'sabha', t:L4("Indraprastha and the Rajasuya|इन्द्रप्रस्थ और राजसूय|இந்திரப்பிரஸ்தமும் ராஜசூயமும்|ఇంద్రప్రస్థం, రాజసూయం"),
   d:["The Pandavas build a splendid capital and Yudhishthira performs the Rajasuya sacrifice, which deepens Duryodhana’s envy.","पाण्डव भव्य राजधानी बनाते हैं और युधिष्ठिर राजसूय यज्ञ करते हैं, जिससे दुर्योधन की ईर्ष्या बढ़ती है।","பாண்டவர்கள் அழகிய தலைநகரை அமைக்கிறார்கள்; யுதிஷ்டிரன் ராஜசூய யாகம் செய்கிறான்; அது துரியோதனனின் பொறாமையை மிகுதியாக்குகிறது.","పాండవులు వైభవోపేతమైన రాజధానిని నిర్మిస్తారు; యుధిష్ఠిరుడు రాజసూయ యాగం చేస్తాడు; అది దుర్యోధనుని అసూయను పెంచుతుంది."] },
 { p:'sabha', t:L4("The game of dice|द्यूत-क्रीड़ा|சூதாட்டம்|జూదం"),
   d:["Yudhishthira loses his wealth, kingdom, brothers and Draupadi to Shakuni’s dice; the Pandavas are sent into exile.","युधिष्ठिर शकुनि के पासों में धन, राज्य, भाइयों और द्रौपदी को हार जाते हैं; पाण्डवों को वनवास मिलता है।","சகுனியின் பகடையில் யுதிஷ்டிரன் செல்வம், நாடு, சகோதரர், திரௌபதி அனைத்தையும் இழக்கிறான்; பாண்டவர்கள் வனவாசம் செல்கிறார்கள்.","శకుని పాచికలలో యుధిష్ఠిరుడు సంపద, రాజ్యం, సోదరులు, ద్రౌపదిని కోల్పోతాడు; పాండవులు వనవాసానికి వెళ్తారు."] },
 { p:'vana', t:L4("Twelve years in the forest|वन में बारह वर्ष|காட்டில் பன்னிரண்டு ஆண்டுகள்|అడవిలో పన్నెండేళ్ళు"),
   d:["The Pandavas live in the forest for twelve years, meeting sages, facing trials and the yaksha’s questions.","पाण्डव बारह वर्ष वन में रहते हैं, ऋषियों से मिलते हैं और परीक्षाएँ तथा यक्ष के प्रश्न झेलते हैं।","பாண்டவர்கள் பன்னிரண்டு ஆண்டுகள் காட்டில் வாழ்ந்து முனிவர்களைச் சந்தித்து, சோதனைகளையும் யட்சனின் கேள்விகளையும் எதிர்கொள்கிறார்கள்.","పాండవులు పన్నెండేళ్ళు అడవిలో ఉండి ఋషులను కలుస్తారు; పరీక్షలను, యక్షుని ప్రశ్నలను ఎదుర్కొంటారు."] },
 { p:'virata', t:L4("A year in disguise|छिपकर एक वर्ष|மறைந்து ஓர் ஆண்டு|మారువేషంలో ఒక సంవత్సరం"),
   d:["In the thirteenth year they serve incognito at King Virata’s court, and Bhima kills Kichaka.","तेरहवें वर्ष वे पहचान छिपाकर राजा विराट के दरबार में सेवा करते हैं, और भीम कीचक का वध करते हैं।","பதின்மூன்றாம் ஆண்டில் அடையாளம் மறைத்து விராட மன்னனின் அரண்மனையில் பணியாற்றுகிறார்கள்; பீமன் கீசகனைக் கொல்கிறான்.","పదమూడవ ఏడు గుర్తు తెలియకుండా విరాటరాజు కొలువులో సేవ చేస్తారు; భీముడు కీచకుని చంపుతాడు."] },
 { p:'udyoga', t:L4("Krishna’s embassy|कृष्ण का दूतकर्म|கிருஷ்ணனின் தூது|కృష్ణ రాయబారం"),
   d:["Krishna goes to Hastinapura asking for five villages for peace, but Duryodhana refuses even a needle-point of land.","कृष्ण शान्ति के लिए पाँच गाँव माँगने हस्तिनापुर जाते हैं, पर दुर्योधन सुई की नोक भर भूमि भी नहीं देता।","அமைதிக்காக ஐந்து கிராமங்களைக் கேட்டுக் கிருஷ்ணன் ஹஸ்தினாபுரம் செல்கிறான்; துரியோதனன் ஊசி முனையளவு நிலத்தையும் தர மறுக்கிறான்.","శాంతి కోసం ఐదు గ్రామాలు అడగటానికి కృష్ణుడు హస్తినాపురానికి వెళ్తాడు; దుర్యోధనుడు సూది మొన అంత నేల కూడా ఇవ్వనంటాడు."] },
 { p:'bhishma', t:L4("Kurukshetra and the Gita|कुरुक्षेत्र और गीता|குருக்ஷேத்திரமும் கீதையும்|కురుక్షేత్రం, గీత"),
   d:["The armies meet for an eighteen-day war. Before the first arrow, Krishna teaches Arjuna the Bhagavad Gita.","सेनाएँ अठारह दिन के युद्ध के लिए आमने-सामने आती हैं। पहला बाण चलने से पहले कृष्ण अर्जुन को भगवद्गीता सुनाते हैं।","பதினெட்டு நாள் போருக்குச் சேனைகள் எதிரெதிரே நிற்கின்றன. முதல் அம்புக்கு முன் கிருஷ்ணன் அர்ஜுனனுக்குப் பகவத் கீதையை உபதேசிக்கிறான்.","పద్దెనిమిది రోజుల యుద్ధానికి సేనలు ఎదురెదురు నిలుస్తాయి. మొదటి బాణానికి ముందు కృష్ణుడు అర్జునునికి భగవద్గీతను బోధిస్తాడు."] },
 { p:'sauptika', t:L4("The war ends|युद्ध का अन्त|போரின் முடிவு|యుద్ధ ముగింపు"),
   d:["Bhishma, Drona, Karna and Duryodhana fall one by one; in the night, Ashvatthama kills the Pandavas’ sleeping sons.","भीष्म, द्रोण, कर्ण और दुर्योधन एक-एक कर गिरते हैं; रात में अश्वत्थामा पाण्डवों के सोते हुए पुत्रों को मार देता है।","பீஷ்மர், துரோணர், கர்ணன், துரியோதனன் ஒவ்வொருவராக வீழ்கிறார்கள்; இரவில் அஸ்வத்தாமன் பாண்டவர்களின் உறங்கும் மகன்களைக் கொல்கிறான்.","భీష్ముడు, ద్రోణుడు, కర్ణుడు, దుర్యోధనుడు ఒకరి తర్వాత ఒకరు పడిపోతారు; రాత్రి అశ్వత్థామ పాండవుల నిద్రిస్తున్న కుమారులను చంపుతాడు."] },
 { p:'shanti', t:L4("Yudhishthira is crowned|युधिष्ठिर का राज्याभिषेक|யுதிஷ்டிரன் முடிசூடுகிறான்|యుధిష్ఠిరుని పట్టాభిషేకం"),
   d:["Grieving but dutiful, Yudhishthira becomes king and learns the duties of a ruler from Bhishma on his bed of arrows.","शोकाकुल पर कर्तव्यनिष्ठ युधिष्ठिर राजा बनते हैं और शरशय्या पर लेटे भीष्म से राजधर्म सीखते हैं।","துயரத்தில் இருந்தாலும் கடமை தவறாத யுதிஷ்டிரன் அரசனாகிறான்; அம்புப் படுக்கையில் இருக்கும் பீஷ்மரிடம் அரசதர்மத்தைக் கற்கிறான்.","దుఃఖంలో ఉన్నా కర్తవ్యనిష్ఠుడైన యుధిష్ఠిరుడు రాజై, శరపంజరంపై ఉన్న భీష్ముని నుండి రాజధర్మం నేర్చుకుంటాడు."] },
 { p:'mahaprasthanika', t:L4("The last journey|अन्तिम यात्रा|இறுதிப் பயணம்|చివరి ప్రయాణం"),
   d:["After the Yadavas perish and Krishna departs, the Pandavas hand over the kingdom and walk toward the Himalaya; one by one the others fall, and Yudhishthira walks on with a dog.","यादवों के विनाश और कृष्ण के प्रस्थान के बाद पाण्डव राज्य सौंपकर हिमालय की ओर चलते हैं; एक-एक कर सब गिरते हैं और युधिष्ठिर एक कुत्ते के साथ आगे बढ़ते हैं।","யாதவர்கள் அழிந்து கிருஷ்ணன் மறைந்தபின், பாண்டவர்கள் அரசை ஒப்படைத்து இமயமலை நோக்கி நடக்கிறார்கள்; ஒவ்வொருவராக விழ, யுதிஷ்டிரன் ஒரு நாயுடன் தொடர்ந்து செல்கிறான்.","యాదవులు నశించి, కృష్ణుడు నిష్క్రమించాక, పాండవులు రాజ్యాన్ని అప్పగించి హిమాలయాల వైపు నడుస్తారు; ఒక్కొక్కరూ పడిపోగా యుధిష్ఠిరుడు ఒక కుక్కతో ముందుకు సాగుతాడు."] }
];

const QUIZ = [
 { q:["Who is traditionally regarded as the author of the Mahabharata?","परम्परा के अनुसार महाभारत के रचयिता कौन माने जाते हैं?","மகாபாரதத்தை இயற்றியவராக மரபு யாரைக் கருதுகிறது?","మహాభారత రచయితగా సంప్రదాయం ఎవరిని భావిస్తుంది?"],
   o:['vyasa','valmiki','kalidasa','tulsidas'], c:'vyasa',
   e:["Vyasa is credited as the composer, and also appears in the story as the grandfather of the Pandavas and Kauravas.","रचयिता के रूप में व्यास को श्रेय दिया जाता है, और वे कथा में पाण्डवों व कौरवों के पितामह के रूप में भी आते हैं।","இயற்றியவராக வியாசரைக் குறிப்பிடுகிறார்கள்; கதையிலும் பாண்டவர், கௌரவர் இருவருக்கும் பாட்டனாக வருகிறார்.","రచయితగా వ్యాసునికి ఘనత; కథలో కూడా పాండవులకు, కౌరవులకు పితామహుడిగా వస్తాడు."] },
 { q:["Who, by tradition, wrote down the epic as Vyasa dictated?","परम्परा के अनुसार व्यास के बोलने पर महाकाव्य किसने लिखा?","மரபுப்படி வியாசர் சொல்லச் சொல்ல காவியத்தை எழுதியவர் யார்?","సంప్రదాయం ప్రకారం వ్యాసుడు చెబుతుండగా ఇతిహాసాన్ని ఎవరు వ్రాశారు?"],
   o:['ganesha','hanuman','brahma','narada'], c:'ganesha',
   e:["Ganesha agreed to be the scribe on the condition that Vyasa never pause.","गणेश ने इस शर्त पर लेखक बनना स्वीकार किया कि व्यास रुकेंगे नहीं।","வியாசர் நிறுத்தாமல் சொல்ல வேண்டும் என்ற நிபந்தனையுடன் விநாயகர் எழுத்தாளராக ஒப்புக்கொண்டார்.","వ్యాసుడు ఆపకుండా చెప్పాలనే షరతుతో వినాయకుడు లేఖకుడిగా ఒప్పుకున్నాడు."] },
 { q:["To whom did Krishna speak the Bhagavad Gita?","कृष्ण ने भगवद्गीता किसे सुनाई?","பகவத் கீதையைக் கிருஷ்ணன் யாருக்கு உபதேசித்தான்?","భగవద్గీతను కృష్ణుడు ఎవరికి బోధించాడు?"],
   o:['arjuna','bhima','karna','yudhishthira'], c:'arjuna',
   e:["On the field of Kurukshetra, before the war began, Krishna taught Arjuna.","युद्ध आरम्भ होने से पहले कुरुक्षेत्र में कृष्ण ने अर्जुन को उपदेश दिया।","போர் தொடங்குமுன் குருக்ஷேத்திரத்தில் கிருஷ்ணன் அர்ஜுனனுக்கு உபதேசித்தான்.","యుద్ధం మొదలయ్యే ముందు కురుక్షేత్రంలో కృష్ణుడు అర్జునునికి బోధించాడు."] },
 { q:["What was Bhishma’s name before his terrible vow?","भीष्म की भीषण प्रतिज्ञा से पहले उनका नाम क्या था?","கடும் சபதத்துக்கு முன் பீஷ்மரின் பெயர் என்ன?","భయంకర ప్రతిజ్ఞకు ముందు భీష్ముని పేరు ఏమిటి?"],
   o:['devavrata','vrikodara','dhananjaya','ashvatthama'], c:'devavrata',
   e:["He was born Devavrata and became Bhishma after vowing to give up the throne and never marry.","वे देवव्रत के रूप में जन्मे और राज्य व विवाह त्यागने की प्रतिज्ञा के बाद भीष्म कहलाए।","அவன் தேவவிரதனாகப் பிறந்து, அரசையும் திருமணத்தையும் துறக்கும் சபதத்துக்குப் பின் பீஷ்மன் ஆனான்.","అతడు దేవవ్రతునిగా పుట్టి, రాజ్యాన్ని, వివాహాన్ని త్యజిస్తానని ప్రతిజ్ఞ చేశాక భీష్ముడయ్యాడు."] },
 { q:["Who was the mother of Karna?","कर्ण की माता कौन थीं?","கர்ணனின் தாய் யார்?","కర్ణుని తల్లి ఎవరు?"],
   o:['kunti','gandhari','draupadi','madri'], c:'kunti',
   e:["Kunti bore Karna before her marriage, using the mantra given by Durvasa.","कुन्ती ने दुर्वासा के दिए मन्त्र से विवाह से पहले कर्ण को जन्म दिया।","துர்வாசர் அளித்த மந்திரத்தால் குந்தி திருமணத்துக்கு முன் கர்ணனைப் பெற்றாள்.","దుర్వాసుడు ఇచ్చిన మంత్రంతో కుంతి వివాహానికి ముందే కర్ణుని కన్నది."] },
 { q:["How many days did the Kurukshetra war last?","कुरुक्षेत्र का युद्ध कितने दिन चला?","குருக்ஷேத்திரப் போர் எத்தனை நாள் நடந்தது?","కురుక్షేత్ర యుద్ధం ఎన్ని రోజులు సాగింది?"],
   o:['#10','#18','#21','#100'], c:'#18',
   e:["Tradition counts eighteen days of battle, and the epic itself has eighteen parvas.","परम्परा में युद्ध अठारह दिन का माना गया है, और महाकाव्य में अठारह पर्व भी हैं।","மரபு போரை பதினெட்டு நாள் எனக் கணக்கிடுகிறது; காவியத்திலும் பதினெட்டு பர்வங்கள் உள்ளன.","సంప్రదాయం యుద్ధాన్ని పద్దెనిమిది రోజులుగా లెక్కిస్తుంది; ఇతిహాసంలో కూడా పద్దెనిమిది పర్వాలు ఉన్నాయి."] },
 { q:["Where was the great war fought?","महायुद्ध कहाँ लड़ा गया?","பெரும்போர் எங்கு நடந்தது?","మహాయుద్ధం ఎక్కడ జరిగింది?"],
   o:['kurukshetra','ayodhya','lanka','hastinapura'], c:'kurukshetra',
   e:["The armies met at Kurukshetra, the field of the Kurus, in the plains near present-day Haryana.","सेनाएँ कुरुक्षेत्र में मिलीं, जो वर्तमान हरियाणा के पास के मैदानों में है।","இன்றைய ஹரியானா அருகிலுள்ள சமவெளியில் உள்ள குருக்ஷேத்திரத்தில் சேனைகள் மோதின.","నేటి హర్యానా సమీపంలోని మైదానాల్లోని కురుక్షేత్రంలో సేనలు తలపడ్డాయి."] },
 { q:["Which queen covered her eyes with a cloth for life?","किस रानी ने जीवन भर अपनी आँखों पर पट्टी बाँधी?","வாழ்நாள் முழுவதும் தன் கண்களைத் துணியால் கட்டிக்கொண்ட அரசி யார்?","జీవితాంతం కళ్ళకు గంతలు కట్టుకున్న రాణి ఎవరు?"],

function sentences(text){
  const m = text.match(/[^.।?!]+[.।?!]?\s*/g);
  return (m||[text]).map(s=>s.trim()).filter(Boolean);
}
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.hidden=false;
  clearTimeout(toast.t); toast.t=setTimeout(()=>{el.hidden=true},3200);
}

/* ---------------------------------------------------------------------
   narrator (Web Speech API)
   --------------------------------------------------------------------- */
const Narr = {
  supported: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [], segs: [], i: 0, gen: 0, state: 'idle', active: null,
  load(){ if(this.supported) this.voices = speechSynthesis.getVoices() || []; },
  norm(l){ return String(l).toLowerCase().replace('_','-'); },
  forLang(pre){ return this.voices.filter(v => this.norm(v.lang).startsWith(pre)); },
  pick(code){
    const pre = code.slice(0,2).toLowerCase(), list = this.forLang(pre);
    const saved = settings.voices[pre];
    if(saved){ const v=list.find(v=>v.voiceURI===saved); if(v) return v; }
    return list.find(v=>this.norm(v.lang)===this.norm(code)) || list[0] || null;
  },
  setActive(el){
    if(this.active) this.active.classList.remove('speaking');
    this.active = el || null;
    if(el){ el.classList.add('speaking'); try{ el.scrollIntoView({block:'nearest', behavior: reduceMotion?'auto':'smooth'}); }catch(e){} }
  },
  emit(){ updReader(); updTimeline(); updChar(); },
  play(segs, from){
    if(!this.supported){ toast(t('noSpeech')); return false; }
    this.gen++; speechSynthesis.cancel(); this.setActive(null); this.onDone = null;
    this.segs = segs; this.i = from||0; this.state = 'playing';
    const pre = (segs[0] ? segs[0].lang : 'en').slice(0,2);
    if(this.voices.length && !this.forLang(pre).length) toast(t('noVoice',{l:t('langName')}));
    const g=this.gen; setTimeout(()=>this.speak(g), 60); this.emit(); return true;
  },
  speak(g){
    if(g!==this.gen || this.state!=='playing') return;
    if(this.i >= this.segs.length){ this.state='idle'; this.setActive(null); this.emit(); if(this.onDone) this.onDone(); return; }
    const s=this.segs[this.i];
    const u=new SpeechSynthesisUtterance(s.text);
    u.lang=s.lang; u.rate=settings.rate;
    const v=this.pick(s.lang); if(v) u.voice=v;
    u.onstart=()=>{ if(g===this.gen){ this.setActive(s.el); this.emit(); } };
    u.onend=()=>{ if(g!==this.gen) return; this.i++; this.speak(g); };
    u.onerror=e=>{ if(g!==this.gen) return; if(e.error==='canceled'||e.error==='interrupted') return; this.state='idle'; this.setActive(null); this.emit(); };
    speechSynthesis.speak(u);
  },
  pause(){ if(this.state!=='playing') return; this.gen++; if(this.supported) speechSynthesis.cancel(); this.state='paused'; this.emit(); },
  resume(){ if(this.state!=='paused') return; this.state='playing'; this.gen++; const g=this.gen; setTimeout(()=>this.speak(g),60); this.emit(); },
  stop(silent){
    this.gen++; if(this.supported) speechSynthesis.cancel();
    this.state='idle'; this.segs=[]; this.i=0; this.setActive(null); this.onDone=null;
    if(!silent) this.emit();
  }
};
if(Narr.supported){ Narr.load(); speechSynthesis.onvoiceschanged = () => { Narr.load(); refreshVoiceUi(); }; }
window.addEventListener('pagehide', () => Narr.stop(true));

function readerSegs(){
  const p=PASSAGES[state.idx], sp=LANGS[li()].speech, segs=[];
  segs.push({ text:tx(p.title), lang:sp, el:$('#folioTitle') });
  if(p.verse){
    if(settings.readVerse) segs.push({ text:p.verse.dev.replace(/\n/g,' '), lang:'hi-IN', el:$('#verseBlock') });
    segs.push({ text:tx(p.verse.meaning), lang:sp, el:$('#meaningBlock') });
  }
  $$('#story .sent').forEach(el => segs.push({ text:el.textContent, lang:sp, el }));
  return segs;
}
function startReader(){
  const ok = Narr.play(readerSegs(), 0);
  if(!ok) return;
  Narr.onDone = () => {
    if(settings.autoNext && state.view==='read' && state.idx < PASSAGES.length-1){
      state.autoplay = true; location.hash = '#/read/' + (state.idx+1);
    }
  };
}
function updReader(){
  const pl=$('#bPlay'), pa=$('#bPause'), st=$('#bStop'); if(!pl) return;
  const s=Narr.state;
  pl.hidden = s==='playing'; pa.hidden = s!=='playing'; st.hidden = s==='idle';
  const pr=$('#narrProg'); if(pr) pr.textContent = (s!=='idle' && Narr.segs.length) ? `${Math.min(Narr.i+1,Narr.segs.length)} / ${Narr.segs.length}` : '';
}
function refreshVoiceUi(){
  const sel=$('#voiceSel');

    const pre=state.lang, list=Narr.forLang(pre);
    sel.innerHTML = `<option value="">${esc(t('voiceAuto'))}</option>` + list.map(v=>`<option value="${esc(v.voiceURI)}"${settings.voices[pre]===v.voiceURI?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
    const note=$('#voiceNote'); if(note) note.hidden = !(Narr.voices.length && !list.length);
  }
}

function updTimeline(){

  const s=Narr.state;

/* ----- quiz ----- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startQuiz(){
  const order = shuffle(QUIZ.map((_,i)=>i)).slice(0,QUIZ_LEN);
  state.quiz = { order, opts: order.map(i=>shuffle(QUIZ[i].o)), i:0, score:0, chosen:null, done:false };
}
function viewQuiz(){
  let inner='';
  const u=me(), q=state.quiz;
  if(!u){
    inner = `<div class="gate"><h2 class="folio-title">${esc(t('quizTitle'))}</h2>
      <p class="lede">${esc(t('gateText'))}</p>
      <div class="row" style="justify-content:center">
        <button class="seal" data-act="login-open" type="button">${esc(t('login'))}</button>
        <button class="quiet" data-act="signup-open" type="button">${esc(t('signup'))}</button>
      </div></div>`;
  } else if(!q){
    const sc=(u.scores||[]);
    const best=sc.reduce((b,x)=> (!b||x.s>b.s)?x:b, null);
    const hist = sc.length ? `<ul class="hist">${sc.slice(0,6).map(x=>`<li><span>${esc(new Date(x.d).toLocaleDateString(state.lang==='en'?'en-IN':state.lang+'-IN'))}</span><span>${x.s} / ${x.m}</span></li>`).join('')}</ul>` : `<p class="note">${esc(t('noScores'))}</p>`;
    inner = `<h2 class="folio-title">${esc(t('quizTitle'))}</h2>
      <p class="lede">${esc(t('quizIntro'))}</p>
      <p><button class="seal" data-act="quiz-start" type="button">${esc(t('start'))}</button></p>
      <h3 style="margin-top:1.4em">${esc(t('yourScores'))}${best?` <span class="note">— ${esc(t('best',{s:best.s,m:best.m}))}</span>`:''}</h3>${hist}`;
  } else if(q.done){
    const total=q.order.length, msg = q.score>=8?'great':(q.score>=5?'good':'low');
    const sc=u.scores||[];
    inner = `<h2 class="folio-title">${esc(t('quizTitle'))}</h2>
      <p class="bigscore">${esc(t('score',{s:q.score,m:total}))}</p>
      <p class="lede">${esc(t(msg))}</p>
      <div class="row"><button class="seal" data-act="quiz-start" type="button">${esc(t('again'))}</button></div>
      <h3 style="margin-top:1.4em">${esc(t('yourScores'))}</h3>
      <ul class="hist">${sc.slice(0,6).map(x=>`<li><span>${esc(new Date(x.d).toLocaleDateString(state.lang==='en'?'en-IN':state.lang+'-IN'))}</span><span>${x.s} / ${x.m}</span></li>`).join('')}</ul>`;
  } else {
    const item=QUIZ[q.order[q.i]], total=q.order.length, answered=q.chosen!==null;
    const opts = q.opts[q.i].map((k,j)=>{
      let cls='opt', mk='', dis=answered?' disabled':'';
      if(answered){ if(k===item.c){cls+=' ok'; mk='✓';} else if(k===q.chosen){cls+=' no'; mk='✗';} }
      return `<button class="${cls}" type="button" data-act="quiz-ans" data-k="${esc(k)}"${dis}><span class="mk" aria-hidden="true">${mk||String.fromCharCode(65+j)}</span><span>${esc(optText(k))}</span></button>`;
    }).join('');
    const right = q.chosen===item.c;
    const fb = answered ? `<div class="explain" role="status"><strong>${esc(right?t('correct'):t('wrong'))}</strong> ${esc(tx(item.e))}</div>
      <div class="row"><button class="seal" data-act="quiz-next" type="button">${esc(q.i===total-1?t('seeResult'):t('nextQ'))}</button></div>` : '';
    inner = `<p class="q-count">${esc(t('qOf',{n:q.i+1,m:total}))}</p>
      <h2 class="q-text">${esc(tx(item.q))}</h2>
      <div class="opts" role="group" aria-label="${esc(tx(item.q))}">${opts}</div>${fb}`;
  }
  return page(`
  <section class="page page-left" aria-label="${esc(t('nav_quiz'))}">
    <div class="frame">
      <div class="runhead"><span class="title">${esc(t('nav_quiz'))}</span><span>${me()?esc(me().name):''}</span></div>
      <div class="scroll" lang="${state.lang}">${inner}</div>
    </div>
  </section>`, {single:true});
}

function safeUrl(u){

  try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:''; }catch(e){ return ''; }

function route(){

  const parts = (location.hash||'#/read/0').replace(/^#\/?/,'').split('/');
  state.view = VIEWS.includes(parts[0]) ? parts[0] : 'read';
  if(state.view==='read') state.idx = Math.max(0, Math.min(PASSAGES.length-1, parseInt(parts[1],10)||0));

/* ---------------------------------------------------------------------
   accounts
   --------------------------------------------------------------------- */
async function hashPw(pw, salt){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:100000, hash:'SHA-256'}, key, 256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381; const s=salt+pw; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'f'+h;
  }
}
function openAuth(mode){
  const dlg=$('#dlg'); dlg.dataset.kind='auth'; dlg.className='slip';
  const signup = mode==='signup';
  dlg.innerHTML = `<form class="slipbody" id="authForm" novalidate lang="${state.lang}">
    <h2>${esc(signup?t('signup'):t('login'))}</h2>
    ${signup?`<label class="field"><span>${esc(t('fName'))}</span><input class="inp" id="aName" autocomplete="name" maxlength="60"></label>`:''}
    <label class="field"><span>${esc(t('fEmail'))}</span><input class="inp" id="aEmail" type="email" autocomplete="email" inputmode="email"></label>
    <label class="field"><span>${esc(t('fPass'))}</span><input class="inp" id="aPass" type="password" autocomplete="${signup?'new-password':'current-password'}"></label>
    <p class="err" id="authErr" role="alert"></p>
    <p class="note">${esc(t('authNote'))}</p>
    <div class="row">
      <button class="seal" type="submit">${esc(signup?t('signup'):t('login'))}</button>
      <button class="quiet" type="button" data-act="closeDlg">${esc(t('cancel'))}</button>
    </div>
    <p class="switch">${esc(signup?t('haveAcct'):t('noAcct'))} <button class="linkbtn" type="button" data-act="${signup?'login-open':'signup-open'}">${esc(signup?t('login'):t('signup'))}</button></p>
  </form>`;
  if(!dlg.open) dlg.showModal();
  $('#authForm').addEventListener('submit', e=>{ e.preventDefault(); submitAuth(signup); });
  setTimeout(()=>{ const f=$(signup?'#aName':'#aEmail'); if(f) f.focus(); },30);
}
async function submitAuth(signup){
  const err=$('#authErr'), name=signup?$('#aName').value.trim():'', email=$('#aEmail').value.trim().toLowerCase(), pw=$('#aPass').value;
  if((signup && !name) || !email || !pw){ err.textContent=t('errFill'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent=t('errEmail'); return; }
  const all=users();
  if(signup){
    if(pw.length<6){ err.textContent=t('errPass'); return; }
    if(all[email]){ err.textContent=t('errTaken'); return; }
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    all[email]={ name, salt, hash:await hashPw(pw,salt), scores:[], created:Date.now() };
    store.set('pathaka.users', all);
  } else {
    const u=all[email];
    if(!u || (await hashPw(pw,u.salt))!==u.hash){ err.textContent=t('errCreds'); return; }
  }
  state.user=email; store.set('pathaka.session', email);
  $('#dlg').close(); renderChrome(); render();
  toast(t('welcome',{n:all[email].name}));
}
function logout(){
  Narr.stop(true);
  state.user=null; state.quiz=null; store.set('pathaka.session', null);
  renderChrome(); render(); toast(t('bye'));
}
function saveScore(s,m){
  const all=users(), u=all[state.user]; if(!u) return;
  u.scores=[{s,m,d:Date.now(),l:state.lang}, ...(u.scores||[])].slice(0,20);
  store.set('pathaka.users', all);
}

function openMaker(){
  const m=makerData(); pendingPhoto = m.photo || '';
  const dlg=$('#dlg'); dlg.dataset.kind='maker'; dlg.className='slip wide';
  dlg.innerHTML = `<form class="slipbody" id="makerForm" novalidate lang="${state.lang}">

    <label class="field"><span>${esc(t('fName'))}</span><input class="inp" id="mName" maxlength="80" value="${esc(m.name)}"></label>

    <label class="field"><span>${esc(t('fEmail'))}</span><input class="inp" id="mEmail" type="email" maxlength="120" value="${esc(m.email)}"></label>
    <label class="field"><span>${esc(t('fWeb'))}</span><input class="inp" id="mWeb" maxlength="200" value="${esc(m.web)}"></label>
    <label class="field"><span>${esc(t('fPhoto'))}</span><input class="inp" id="mPhoto" type="file" accept="image/*"></label>
    <p class="err" id="makerErr" role="alert"></p>
    <div class="row">
      <button class="seal" type="submit">${esc(t('save'))}</button>
      <button class="quiet" type="button" data-act="closeDlg">${esc(t('cancel'))}</button>
    </div>
  </form>`;
  if(!dlg.open) dlg.showModal();
  $('#mPhoto').addEventListener('change', e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{
      const S=240, c=document.createElement('canvas'); c.width=c.height=S;
      const side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=(img.height-side)/2;
      c.getContext('2d').drawImage(img,sx,sy,side,side,0,0,S,S);
      pendingPhoto=c.toDataURL('image/jpeg',0.85); URL.revokeObjectURL(url);
    };
    img.onerror=()=>URL.revokeObjectURL(url);
    img.src=url;
  });
  $('#makerForm').addEventListener('submit', e=>{
    e.preventDefault();
    const data={ name:$('#mName').value.trim(), role:$('#mRole').value.trim(), bio:$('#mBio').value.trim(), email:$('#mEmail').value.trim(), web:$('#mWeb').value.trim(), photo:pendingPhoto||'' };
    if(!data.name){ $('#makerErr').textContent=t('errFill'); return; }
    store.set('pathaka.maker', data);
    $('#dlg').close(); render(); toast(t('saved'));
  });
}

/* ---------------------------------------------------------------------
   events
   --------------------------------------------------------------------- */
document.addEventListener('click', e=>{
  const dlg=$('#dlg');
  if(e.target===dlg){ dlg.close(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  switch(act){
    case 'play': Narr.state==='paused' ? Narr.resume() : startReader(); break;
    case 'pause': Narr.pause(); break;
    case 'stop': Narr.stop(); break;
    case 'prevf': location.hash='#/read/'+Math.max(0,state.idx-1); break;
    case 'nextf': location.hash='#/read/'+Math.min(PASSAGES.length-1,state.idx+1); break;
    case 'goto': location.hash='#/read/'+b.dataset.i; break;
    case 'filter': state.charFilter=b.dataset.g; render(); break;
    case 'char': openChar(b.dataset.id); break;
    case 'char-play': playChar(b.dataset.id); break;
    case 'char-stop': Narr.stop(); break;
    case 'closeDlg': dlg.close(); break;
    case 'tl-all': {
      if(Narr.state==='paused'){ Narr.resume(); break; }
      Narr.play(EVENTS.map((_,i)=>eventSeg(i)),0); break; }
    case 'tl-play': Narr.play([eventSeg(parseInt(b.dataset.i,10))],0); break;
    case 'quiz-start': startQuiz(); render(); break;
    case 'quiz-ans': {
      const q=state.quiz; if(!q||q.chosen!==null) break;
      q.chosen=b.dataset.k; if(q.chosen===QUIZ[q.order[q.i]].c) q.score++;
      render(); const nx=$('[data-act="quiz-next"]'); if(nx) nx.focus(); break; }
    case 'quiz-next': {
      const q=state.quiz; if(!q) break;
      if(q.i===q.order.length-1){ q.done=true; saveScore(q.score,q.order.length); }
      else { q.i++; q.chosen=null; }
      render(); break; }
    case 'login-open': openAuth('login'); break;
    case 'signup-open': openAuth('signup'); break;
    case 'logout': logout(); break;
    case 'edit-maker': openMaker(); break;
  }
});
document.addEventListener('change', e=>{
  const id=e.target.id;
  if(id==='langSel'){
    Narr.stop(true); state.lang=e.target.value; settings.lang=state.lang; saveSettings();
    renderChrome(); render();
    const d=$('#dlg'); if(d.open && d.dataset.kind!=='char') { /* auth / maker forms rebuild in the new language */ if(d.dataset.kind==='auth') openAuth($('#aName')?'signup':'login'); else if(d.dataset.kind==='maker') openMaker(); }
    else if(d.open && d.dataset.kind==='char') d.close();
  }
  if(id==='chkVerse'){ settings.readVerse=e.target.checked; saveSettings(); }
  if(id==='chkNext'){ settings.autoNext=e.target.checked; saveSettings(); }
  if(id==='voiceSel'){ const pre=state.lang; if(e.target.value) settings.voices[pre]=e.target.value; else delete settings.voices[pre]; saveSettings(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='rate'){ settings.rate=parseFloat(e.target.value); $('#rateOut').textContent=settings.rate.toFixed(2)+'×'; saveSettings(); }
});
$('#dlg').addEventListener('close', ()=>{ if($('#dlg').dataset.kind==='char') Narr.stop(true); });

/* ---------------------------------------------------------------------
   start
   --------------------------------------------------------------------- */
route();
})();

/* ---------------- scene art ---------------- */
function art(){
  var o=[];
  o.push('<svg class="amb-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">');
  o.push('<defs>'+
   '<radialGradient id="aSun"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#ffe08a"/><stop offset=".7" stop-color="#ffa645"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>'+
   '<radialGradient id="aGlow"><stop offset="0" stop-color="#ffc864" stop-opacity=".55"/><stop offset="1" stop-color="#ffc864" stop-opacity="0"/></radialGradient>'+
   '<radialGradient id="aCloud"><stop offset="0" stop-color="#fff0dc" stop-opacity=".6"/><stop offset="1" stop-color="#fff0dc" stop-opacity="0"/></radialGradient>'+
   '<linearGradient id="aFog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc98a" stop-opacity="0"/><stop offset="1" stop-color="#ffc98a" stop-opacity=".32"/></linearGradient>'+
   '</defs>');
  // stars
  var st=''; for(var i=0;i<110;i++){ st+='<circle class="star" cx="'+rnd(0,1600).toFixed(0)+'" cy="'+rnd(0,520).toFixed(0)+'" r="'+rnd(.6,1.8).toFixed(2)+'" fill="#fff6dc" style="animation-delay:'+rnd(0,3).toFixed(2)+'s;animation-duration:'+rnd(2,5).toFixed(1)+'s"/>'; }
  o.push('<g class="ly" data-d=".3"><g class="stars">'+st+'</g></g>');
  // sun mandala
  var rays=''; for(i=0;i<48;i++){ var L=i%2?210:270; rays+='<path d="M-5 -92 L0 -'+L+' L5 -92Z" transform="rotate('+(i*7.5)+')" fill="#ffd27a" opacity="'+(i%2?.35:.55)+'"/>'; }
  var petals=''; for(i=0;i<12;i++){ petals+='<path d="M0 -108 C-26 -140 -26 -178 0 -206 C26 -178 26 -140 0 -108Z" transform="rotate('+(i*30)+')" fill="none" stroke="#ffe3a0" stroke-width="1.3" opacity=".55"/>'; }
  o.push('<g class="ly" data-d=".5"><g transform="translate(800 470)"><g class="sun">'+
    '<circle r="330" fill="url(#aGlow)"/>'+
    '<g class="rays">'+rays+'</g>'+
    '<g class="ring-a">'+petals+'</g>'+
    '<g class="ring-b"><circle r="300" fill="none" stroke="#ffe3a0" stroke-width="1" stroke-dasharray="3 14" opacity=".5"/><circle r="236" fill="none" stroke="#ffe3a0" stroke-width="1.2" stroke-dasharray="1 9" opacity=".45"/></g>'+
    '<circle r="92" fill="url(#aSun)"/></g></g></g>');
  // moon
  o.push('<g class="ly" data-d=".5"><g class="moon"><circle cx="1260" cy="200" r="120" fill="url(#aGlow)"/><path d="M1260 150 A50 50 0 1 0 1260 250 A34 50 0 1 1 1260 150Z" fill="#fff4d2"/></g></g>');
  // clouds
  var cl=''; var ys=[150,240,330,200], dur=[170,230,140,200], del=[-20,-110,-60,-150];

  o.push('<g class="ly" data-d=".8">'+cl+'</g>');
  // far mountains
  o.push('<g class="ly" data-d="1.2"><path class="far" d="M-40 640 L100 560 L230 610 L380 510 L520 600 L650 540 L800 612 L950 528 L1100 600 L1250 516 L1400 592 L1530 540 L1660 590 V1000 H-40Z"/></g>');
  // mid hills + banners + tents
  var fl='';

  for(i=0;i<5;i++){ fl+=pole(150+i*80+rnd(-10,10),676+rnd(-4,4),rnd(70,120),'#e8c973'); }
  for(i=0;i<5;i++){ fl+=pole(1090+i*84+rnd(-10,10),676+rnd(-4,4),rnd(70,120),'#a3342a'); }
  var tents=''; [90,250,330,1180,1330,1500].forEach(function(x){ tents+='<path d="M'+x+' 700 l24 -30 l24 30Z"/>'; });
  o.push('<g class="ly" data-d="2"><path class="midf" d="M-40 704 C200 650 350 694 520 664 S820 622 1000 672 S1400 640 1660 694 V1000 H-40Z"/><g class="nearf" opacity=".85">'+tents+'</g>'+fl+'<rect x="-40" y="660" width="1700" height="120" fill="url(#aFog)"/></g>');
  // near ground, banyan, chariot
  var spokes=''; for(i=0;i<12;i++){ spokes+='<line x1="0" y1="0" x2="0" y2="-33" transform="rotate('+(i*30)+')"/>'; }

      '<g class="nearf"><circle cx="-16" cy="-116" r="8"/><path d="M-26 -94 L-22 -110 Q-16 -108 -10 -110 L-6 -94Z"/><circle cx="18" cy="-128" r="8"/><path d="M8 -94 L12 -118 Q18 -116 24 -118 L28 -94Z"/></g>'+
      '<path class="nearstroke" d="M40 -156 Q72 -120 40 -84" fill="none" stroke-width="3"/><line class="nearstroke" x1="40" y1="-156" x2="40" y2="-84" stroke-width=".8"/>'+
      '<g transform="translate(-6 -34)"><g class="wheel nearstroke" fill="none" stroke-width="3"><circle r="34"/><circle r="6"/>'+spokes+'</g><circle r="35" fill="none" stroke="#e8c973" stroke-width="1" opacity=".5"/></g>'+
    '</g>'+
    '</g>');

  var gr=''; for(var g=0;g<5;g++){ var b=''; for(i=0;i<30;i++){ var x=g*320+i*10.7+rnd(-3,3), hh=rnd(28,74), dx=rnd(-10,10); b+='<path d="M'+x.toFixed(0)+' 940 Q'+(x+dx/2).toFixed(0)+' '+(900-hh*.6).toFixed(0)+' '+(x+dx).toFixed(0)+' '+(900-hh).toFixed(0)+' Q'+(x+dx/2+3).toFixed(0)+' '+(900-hh*.55).toFixed(0)+' '+(x+5).toFixed(0)+' 940Z"/>'; }
    gr+='<g class="blade nearf" style="animation-delay:'+(g*-.7).toFixed(1)+'s;animation-duration:'+(3+g*.4).toFixed(1)+'s">'+b+'</g>'; }
  o.push('<g class="ly" data-d="4.6">'+gr+'</g>');
  o.push('</svg>');
  return o.join('');

var emb=[],fly=[],mote=[],arrows=[],flocks=[],shooters=[],petals=[],sparks=[];
